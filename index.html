<style>
  :root{
    --navy: #14213D;
    --navy-2: #1E2E52;
    --paper: #F4F5F7;
    --panel: #FFFFFF;
    --ink: #1F2430;
    --muted: #737C8C;
    --line: #E3E5EA;
    --amber: #E8871E;
    --amber-soft: #FCEBD4;
    --green: #2F9E5B;
    --green-soft: #E1F3E7;
    --red: #D64550;
    --red-soft: #FBE3E5;
    --gray-soft: #ECEDF0;
    --blue: #2563EB;
    --blue-soft: #DBEAFE;
    --purple: #7C3AED;
    --purple-soft: #EDE9FE;
    --mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--paper);color:var(--ink);font-family:var(--sans);}
  body{min-height:100vh;}
  .app{max-width:1340px;margin:0 auto;padding:20px 24px 60px;}

  /* ─── Topbar ─── */
  .topbar{
    display:flex;align-items:center;justify-content:space-between;
    background:linear-gradient(135deg, var(--navy) 0%, var(--navy-2) 100%);
    color:#fff;border-radius:14px;padding:20px 26px;margin-bottom:20px;
    box-shadow:0 8px 24px -12px rgba(20,33,61,0.5);
  }
  .brand{display:flex;align-items:center;gap:12px;}
  .brand .dot{width:10px;height:10px;border-radius:50%;background:var(--green);box-shadow:0 0 0 0 rgba(47,158,91,.6);animation:pulse 2s infinite;}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(47,158,91,.55);}70%{box-shadow:0 0 0 8px rgba(47,158,91,0);}100%{box-shadow:0 0 0 0 rgba(47,158,91,0);}}
  .brand h1{font-size:15px;letter-spacing:.14em;text-transform:uppercase;margin:0;font-weight:700;}
  .brand .sub{font-size:12px;color:#B9C2DA;letter-spacing:.02em;margin-top:2px;}
  .brand-text{display:flex;flex-direction:column;}
  .brand-logo{height:32px;width:auto;object-fit:contain;display:block;}
  @media (max-width:640px){ .brand-logo{height:24px;} }
  .topbar-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .stats{display:flex;gap:10px;flex-wrap:wrap;}
  .stat{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);border-radius:10px;padding:8px 14px;text-align:center;min-width:78px;}
  .stat .num{font-family:var(--mono);font-size:20px;font-weight:700;line-height:1;}
  .stat .lbl{font-size:10px;color:#B9C2DA;text-transform:uppercase;letter-spacing:.08em;margin-top:4px;}
  .stat.red .num{color:#FF9AA2;}.stat.green .num{color:#8FE3AE;}.stat.gray .num{color:#C9CFDD;}

  /* ─── Tabs ─── */
  .tabs{display:flex;gap:6px;margin-bottom:18px;border-bottom:1px solid var(--line);overflow-x:auto;}
  .tab{padding:10px 18px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;user-select:none;letter-spacing:.01em;white-space:nowrap;}
  .tab:hover{color:var(--ink);}
  .tab.active{color:var(--navy);border-bottom-color:var(--amber);}

  .panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px;margin-bottom:16px;}
  .panel h2{font-size:15px;margin:0 0 4px;color:var(--ink);}
  .panel .desc{font-size:12.5px;color:var(--muted);margin:0 0 18px;}

  /* ─── Forms ─── */
  label{display:block;font-size:11.5px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px;}
  input,select{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;font-size:13.5px;color:var(--ink);background:#fff;font-family:var(--sans);}
  input:focus,select:focus{outline:none;border-color:var(--navy);box-shadow:0 0 0 3px rgba(20,33,61,.08);}
  .field{margin-bottom:14px;}
  .row{display:grid;gap:14px;}
  .row.cols-4{grid-template-columns:2fr 1fr 1fr 1fr;}
  .row.cols-3{grid-template-columns:2fr 1fr 1fr;}
  .row.cols-2{grid-template-columns:1fr 1fr;}
  .btn{appearance:none;border:none;border-radius:8px;padding:10px 18px;font-size:13.5px;font-weight:700;cursor:pointer;font-family:var(--sans);letter-spacing:.01em;}
  .btn-primary{background:var(--navy);color:#fff;}
  .btn-primary:hover{background:var(--navy-2);}
  .btn-ghost{background:var(--gray-soft);color:var(--ink);}
  .btn-ghost:hover{background:#E1E3E8;}
  .btn-danger-outline{background:#fff;color:var(--red);border:1px solid var(--red-soft);padding:5px 10px;font-size:12px;}
  .btn-danger-outline:hover{background:var(--red-soft);}
  .btn-success{background:var(--green);color:#fff;}
  .btn-success:hover{background:#238048;}

  /* ─── Table ─── */
  table{width:100%;border-collapse:collapse;font-size:12.8px;}
  th{text-align:left;padding:9px 10px;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);border-bottom:2px solid var(--line);cursor:pointer;white-space:nowrap;position:sticky;top:0;background:var(--panel);}
  th:hover{color:var(--ink);}
  td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle;}
  tr:hover td{background:#FAFBFC;}
  .num-cell{font-family:var(--mono);text-align:right;font-variant-numeric:tabular-nums;}
  .table-scroll{max-height:560px;overflow:auto;border:1px solid var(--line);border-radius:10px;}

  .badge{display:inline-block;padding:3px 10px;border-radius:100px;font-size:11px;font-weight:700;letter-spacing:.02em;white-space:nowrap;}
  .badge.pedir{background:var(--red-soft);color:var(--red);}
  .badge.ok{background:var(--green-soft);color:var(--green);}
  .badge.sindato{background:var(--gray-soft);color:var(--muted);}

  .toolbar{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap;align-items:center;}
  .toolbar input[type=text]{max-width:280px;}
  .toolbar select{max-width:180px;}
  .toolbar .spacer{flex:1;}
  .hint{font-size:11.5px;color:var(--muted);}

  .empty{padding:40px 20px;text-align:center;color:var(--muted);font-size:13px;}
  .legend-row{display:flex;gap:16px;margin-top:10px;flex-wrap:wrap;}
  .legend-item{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted);}
  .legend-dot{width:9px;height:9px;border-radius:3px;}

  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:11px 20px;border-radius:8px;font-size:13px;box-shadow:0 8px 24px -8px rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:opacity .25s, transform .25s;z-index:50;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-6px);}

  ::-webkit-scrollbar{width:10px;height:10px;}
  ::-webkit-scrollbar-thumb{background:#D3D6DD;border-radius:6px;}
  ::-webkit-scrollbar-track{background:transparent;}

  /* ─────────────────────────────────────────────
     MOBILE — vista avanzada ≤ 640 px
     ───────────────────────────────────────────── */

  /* Bottom navigation bar */
  .bottom-nav{
    display:none;
    position:fixed;bottom:0;left:0;right:0;z-index:200;
    background:var(--panel);border-top:1px solid var(--line);
    padding:0 0 env(safe-area-inset-bottom,0px);
    box-shadow:0 -4px 16px -4px rgba(20,33,61,.12);
  }
  .bottom-nav-inner{display:flex;overflow-x:auto;scrollbar-width:none;}
  .bottom-nav-inner::-webkit-scrollbar{display:none;}
  .bnav-item{
    flex:0 0 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:8px 12px 6px;min-width:58px;cursor:pointer;
    border-top:2px solid transparent;font-size:9px;font-weight:700;color:var(--muted);
    letter-spacing:.03em;text-transform:uppercase;gap:2px;user-select:none;
  }
  .bnav-item .bnav-icon{font-size:19px;line-height:1;}
  .bnav-item.active{color:var(--navy);border-top-color:var(--amber);}
  .bnav-item:active{background:var(--gray-soft);}

  /* Mobile card */
  .m-card{
    background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:14px 15px;margin-bottom:10px;cursor:pointer;
    transition:box-shadow .15s;
  }
  .m-card:active{box-shadow:0 4px 12px -4px rgba(20,33,61,.2);}
  .m-card-header{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:8px;}
  .m-card-ref{font-size:10px;font-family:var(--mono);color:var(--muted);}
  .m-card-title{font-size:13px;font-weight:700;color:var(--ink);line-height:1.3;margin:2px 0 0;}
  .m-card-body{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}
  .m-kv{display:flex;flex-direction:column;}
  .m-kv .mk{font-size:9px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:2px;}
  .m-kv .mv{font-size:15px;font-weight:800;font-family:var(--mono);color:var(--ink);}
  .m-kv .mv.red{color:var(--red);}
  .m-kv .mv.amber{color:var(--amber);}
  .m-kv .mv.green{color:var(--green);}
  .m-card-footer{margin-top:10px;padding-top:8px;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:8px;}

  /* Mobile KPI strip */
  .m-kpi-strip{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none;margin-bottom:14px;}
  .m-kpi-strip::-webkit-scrollbar{display:none;}
  .m-kpi-pill{
    flex:0 0 auto;background:var(--panel);border:1px solid var(--line);
    border-radius:10px;padding:10px 14px;text-align:center;min-width:80px;cursor:pointer;
  }
  .m-kpi-pill .mpn{font-family:var(--mono);font-size:22px;font-weight:800;line-height:1;}
  .m-kpi-pill .mpl{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-top:3px;}
  .m-kpi-pill.red .mpn{color:var(--red);}
  .m-kpi-pill.green .mpn{color:var(--green);}
  .m-kpi-pill.amber .mpn{color:var(--amber);}

  /* Mobile filter chips */
  .m-chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:12px;scrollbar-width:none;}
  .m-chips::-webkit-scrollbar{display:none;}
  .m-chip{
    flex:0 0 auto;padding:6px 14px;border-radius:100px;font-size:12px;font-weight:600;
    cursor:pointer;user-select:none;border:1.5px solid var(--line);background:var(--panel);color:var(--muted);
  }
  .m-chip.active{background:var(--navy);color:#fff;border-color:var(--navy);}
  .m-chip.chip-red.active{background:var(--red);border-color:var(--red);}
  .m-chip.chip-green.active{background:var(--green);border-color:var(--green);}

  /* Mobile search bar */
  .m-search{position:relative;margin-bottom:12px;}
  .m-search input{padding-left:36px;border-radius:10px;font-size:14px;}
  .m-search::before{content:'🔍';position:absolute;left:11px;top:50%;transform:translateY(-50%);font-size:14px;pointer-events:none;}

  /* Mobile section header */
  .m-section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
  .m-section-header h2{font-size:17px;font-weight:800;margin:0;color:var(--ink);}
  .m-section-header .m-count{font-size:12px;color:var(--muted);background:var(--gray-soft);padding:2px 8px;border-radius:100px;}

  /* ── Breakpoints ────────────────────────────── */
  @media (max-width: 640px){
    body{padding-bottom:80px;}
    .app{padding:10px 10px 88px;}
    .bottom-nav{display:block;}

    /* Topbar compact */
    .topbar{flex-direction:row;align-items:center;padding:10px 14px;border-radius:10px;margin-bottom:10px;gap:8px;}
    .brand h1{font-size:11px;letter-spacing:.07em;}
    .brand .sub{display:none;}
    .brand .dot{width:7px;height:7px;}
    .topbar-right .stats{display:none;}
    #settings-btn{width:30px;height:30px;font-size:13px;flex-shrink:0;}

    /* Hide desktop tabs — bottom nav takes over */
    .tabs{display:none;}

    /* Panels */
    .panel{padding:12px 12px;border-radius:10px;}
    .panel h2{font-size:14px;}

    /* Grid collapses */
    .row.cols-4,.row.cols-3,.row.cols-2,
    .kpis-row,.chart-grid,.chart-grid.three,
    .hero-grid,.vs-row{grid-template-columns:1fr !important;}

    /* Hero */
    .hero-banner{padding:18px;}
    .hero-banner h2{font-size:17px;}
    .hero-banner .hero-sub{font-size:13px;}

    /* Tables scrollable horizontally */
    .table-scroll{overflow-x:auto;max-height:480px;}
    .table-scroll table{font-size:11px;min-width:520px;}
    th,td{padding:7px 8px;}

    /* Modal — full-screen bottom sheet */
    .modal-overlay{padding:0;align-items:flex-end;}
    .modal-box{border-radius:16px 16px 0 0;max-width:100%;padding:20px 14px 24px;max-height:90vh;overflow-y:auto;}

    /* Charts */
    .chart-card{padding:10px 12px;}
    #topchart-wrap{height:260px !important;}

    /* Period buttons */
    .period-bar{gap:4px;flex-wrap:wrap;}
    .period-btn{padding:5px 10px;font-size:11px;}

    /* Toolbar */
    .toolbar{flex-direction:column;align-items:stretch;gap:8px;}
    .toolbar input[type=text]{max-width:100%;}
    .toolbar select{max-width:100%;}
    .toolbar .spacer{display:none;}

    /* Hide stat2 hover lift on touch */
    .stat2:hover{transform:none;box-shadow:none;}

    /* Rank num smaller */
    .rank-num{width:19px;height:19px;font-size:10px;}
  }

  @media (min-width:641px) and (max-width:980px){
    .row.cols-4{grid-template-columns:1fr 1fr;}
    .row.cols-3{grid-template-columns:1fr 1fr;}
    .chart-grid{grid-template-columns:1fr;}
    .chart-grid.three{grid-template-columns:1fr 1fr;}
    .kpis-row{grid-template-columns:repeat(3,1fr);}
    .topbar{flex-direction:column;align-items:flex-start;gap:12px;}
  }

  .modal-overlay{display:none;position:fixed;inset:0;background:rgba(20,33,61,.45);align-items:flex-start;justify-content:center;padding:40px 16px;z-index:100;overflow-y:auto;}
  .modal-overlay.show{display:flex;}
  .modal-box{background:#fff;border-radius:14px;max-width:780px;width:100%;padding:24px;box-shadow:0 24px 60px -12px rgba(0,0,0,.35);}
  .modal-close{float:right;background:var(--gray-soft);border:none;border-radius:8px;padding:6px 12px;cursor:pointer;font-size:13px;font-weight:700;color:var(--ink);}
  .modal-close:hover{background:#E1E3E8;}
  .row-click{cursor:pointer;}
  .row-click:hover td{background:#EEF1FA !important;}
  .sparkbar-wrap{display:flex;align-items:flex-end;gap:3px;height:60px;margin:10px 0;}
  .sparkbar{flex:1;background:var(--navy);border-radius:2px 2px 0 0;min-height:2px;}
  .kv-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 20px;margin-bottom:16px;}
  .kv-item .k{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);}
  .kv-item .v{font-size:15px;font-weight:700;color:var(--ink);font-family:var(--mono);}

  /* ─── Dashboard charts ─── */
  .chart-grid{display:grid;grid-template-columns:1.1fr 1.4fr;gap:20px;margin-top:22px;}
  .chart-grid.full{grid-template-columns:1fr;}
  .chart-grid.three{grid-template-columns:1fr 1fr 1fr;}
  .chart-card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px 20px;}
  .chart-card h3{font-size:13px;margin:0 0 2px;color:var(--ink);display:flex;align-items:center;gap:8px;}
  .chart-card .chart-desc{font-size:11.5px;color:var(--muted);margin:0 0 14px;}
  .chart-canvas-wrap{position:relative;width:100%;}
  .kpi-icon{display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:10px;font-size:17px;margin-bottom:8px;}
  .stat2{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px;min-width:0;transition:transform .15s,box-shadow .15s;}
  .stat2:hover{transform:translateY(-2px);box-shadow:0 10px 20px -12px rgba(20,33,61,.25);}
  .stat2.click-kpi{cursor:pointer;}
  .stat2 .num{font-family:var(--mono);font-size:24px;font-weight:800;line-height:1;color:var(--ink);}
  .stat2 .lbl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-top:6px;}
  .kpis-row{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-top:4px;}
  @media (max-width: 980px){.chart-grid{grid-template-columns:1fr;}.chart-grid.three{grid-template-columns:1fr;}.kpis-row{grid-template-columns:repeat(2,1fr);}}
  .center-label{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;pointer-events:none;}
  .center-label .big{font-family:var(--mono);font-size:26px;font-weight:800;color:var(--ink);line-height:1;}
  .center-label .small{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-top:4px;}

  /* ─── Ventajas / Landing intro ─── */
  .hero-banner{
    background:linear-gradient(135deg,#14213D 0%,#1E2E52 60%,#163359 100%);
    border-radius:16px;padding:36px 40px;color:#fff;margin-bottom:24px;
    position:relative;overflow:hidden;
  }
  .hero-banner::before{
    content:'';position:absolute;top:-60px;right:-60px;width:260px;height:260px;
    border-radius:50%;background:rgba(232,135,30,.12);pointer-events:none;
  }
  .hero-banner h2{font-size:22px;margin:0 0 8px;font-weight:800;letter-spacing:-.01em;}
  .hero-banner .hero-sub{color:#B9C2DA;font-size:14px;margin:0 0 28px;max-width:600px;}
  .hero-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;}
  @media(max-width:760px){.hero-grid{grid-template-columns:1fr;}}
  .hero-card{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:18px 20px;}
  .hero-card .hc-icon{font-size:26px;margin-bottom:10px;}
  .hero-card .hc-title{font-size:13.5px;font-weight:700;margin-bottom:6px;color:#fff;}
  .hero-card .hc-body{font-size:12.5px;color:#B9C2DA;line-height:1.55;}
  .hero-vs{background:rgba(232,135,30,.15);border:1px solid rgba(232,135,30,.3);border-radius:12px;padding:16px 20px;margin-top:16px;}
  .hero-vs .vs-title{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--amber);font-weight:700;margin-bottom:10px;}
  .vs-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .vs-item{display:flex;align-items:flex-start;gap:8px;font-size:12.5px;line-height:1.45;}
  .vs-bad{color:#FF9AA2;}.vs-good{color:#8FE3AE;}

  /* ─── Filtros de periodo ─── */
  .period-bar{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap;align-items:center;}
  .period-btn{background:var(--gray-soft);border:1px solid var(--line);border-radius:8px;padding:6px 14px;font-size:12px;font-weight:600;cursor:pointer;color:var(--muted);font-family:var(--sans);}
  .period-btn.active{background:var(--navy);color:#fff;border-color:var(--navy);}
  .period-btn:hover:not(.active){background:#E1E3E8;color:var(--ink);}

  /* ─── Top ventas ─── */
  .rank-num{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;font-size:11px;font-weight:800;background:var(--navy);color:#fff;}
  .rank-num.gold{background:#F59E0B;}
  .rank-num.silver{background:#9CA3AF;}
  .rank-num.bronze{background:#B45309;}

  /* ─── Informe ─── */
  .report-preview{background:#F8F9FD;border:1px solid var(--line);border-radius:10px;padding:20px;font-size:13px;line-height:1.65;max-height:520px;overflow:auto;}
  .report-preview h3{color:var(--navy);border-bottom:2px solid var(--amber);padding-bottom:6px;margin-top:18px;margin-bottom:10px;font-size:14px;}
  .report-preview table{width:100%;border-collapse:collapse;font-size:12px;margin-top:8px;}
  .report-preview th{background:var(--navy);color:#fff;padding:7px 10px;text-align:left;font-size:11px;}
  .report-preview td{padding:6px 10px;border-bottom:1px solid var(--line);}
  .report-preview tr:nth-child(even) td{background:#F0F2F7;}
</style>
</head>

  function computeAll(){
    if(connected&&serverProductos) return serverProductos;
    return PRODUCTS_RAW.map(computeProduct);
  }

  // ── Período filter helper ─────────────────────
  function getPeriodoLabel(){
    var labels={dia:'Hoy',mes:'Este mes',trimestre:'Este trimestre',semestre:'Este semestre'};
    return labels[periodoActivo]||'Este mes';
  }

  // Simula filtro de consumo según período (en modo local usa el histórico de los m[])
  function getConsumoEnPeriodo(p){
    if(periodoActivo==='dia') return (p.m[2]||0)/30;
    if(periodoActivo==='mes') return p.m[2]||0;
    if(periodoActivo==='trimestre'){
      var vals=p.m.filter(function(v){return typeof v==='number'&&v>0;});
      return vals.reduce(function(a,b){return a+b;},0);
    }
    if(periodoActivo==='semestre'){
      var vals2=p.m.filter(function(v){return typeof v==='number'&&v>0;});
      // extrapolamos a 6 meses si solo tenemos 3
      return vals2.length?Math.round(vals2.reduce(function(a,b){return a+b;},0)*(6/Math.max(vals2.length,1))):0;
    }
    return p.m[2]||0;
  }

  // ── Sheets connection ─────────────────────────
  function mapServerProduct(p){
    return { ref:p.ref,nombre:p.nombre,canal:p.canal,proveedor:p.proveedor,stockActual:p.stockActual,transito:p.transito,
      avgDaily:p.avgDaily,diasCobertura:p.diasCobertura,fechaAgotado:p.fechaAgotado?new Date(p.fechaAgotado):null,
      cantidadSugerida:p.cantidadSugerida,fechaLimitePedido:p.fechaLimitePedido?new Date(p.fechaLimitePedido):null,
      vencido:!!p.vencido,alerta:p.alerta,leadTime:p.leadTime,safety:p.safety };
  }

  function setConnectionStatus(msg,isConnected){
    lastConnStatus=msg; lastConnConnected=isConnected;
    var el=document.getElementById('sheets-status'); if(el) el.textContent=msg;
    var btn=document.getElementById('sheets-sync'); if(btn) btn.style.display=isConnected?'inline-block':'none';
  }

  function abrirAjustesConexion(){
    var html=
      '<button class="modal-close" id="modal-close-btn">Cerrar ✕</button>'+
      '<h2 style="margin-top:0;color:var(--navy);">Conexión a Google Sheets</h2>'+
      '<div class="field"><label>URL de tu Apps Script publicado (/exec)</label>'+
      '<input type="text" id="sheets-url" value="'+escapeHtml(sheetsUrl||DEFAULT_SHEETS_URL)+'"></div>'+
      '<div style="display:flex;gap:10px;margin:10px 0;">'+
        '<button class="btn btn-primary" id="sheets-connect">Conectar</button>'+
        '<button class="btn btn-ghost" id="sheets-sync" style="display:'+(connected?'inline-block':'none')+';">🔄 Sincronizar ahora</button>'+
      '</div>'+
      '<p class="hint" id="sheets-status">'+escapeHtml(lastConnStatus||'')+'</p>';
    openModal(html);
    document.getElementById('modal-close-btn').addEventListener('click',closeModal);
    document.getElementById('sheets-connect').addEventListener('click',function(){ conectarSheets(document.getElementById('sheets-url').value.trim(),false); });
    document.getElementById('sheets-sync').addEventListener('click',function(){ sincronizarSheets(); });
  }

  async function conectarSheets(url,silencioso){
    if(!url){ toast('Pega la URL de tu Apps Script publicado primero.'); return; }
    setConnectionStatus('Conectando…',false);
    try{
      var sep=url.indexOf('?')>=0?'&':'?';
      var res=await fetch(url+sep+'action=data');
      var json=await res.json();
      if(!json.ok) throw new Error(json.error||'Respuesta inválida');
      serverProductos=json.productos.map(mapServerProduct);
      connected=true; sheetsUrl=url;
      try{ await window.storage.set(STORE_URL_KEY,url,false); }catch(e){}
      setConnectionStatus('Conectado a '+(json.empresa||'Google Sheets')+' — '+serverProductos.length+' productos.',true);
      renderStats(); switchTab(currentTab);
      if(!silencioso) toast('Conectado a Google Sheets correctamente.');
    }catch(e){
      connected=false; serverProductos=null;
      setConnectionStatus('No se pudo conectar. Verifica que la URL termine en /exec y acceso sea "Cualquier persona".',false);
      renderStats();
      if(!silencioso) toast('No se pudo conectar a Google Sheets.');
    }
  }

  async function sincronizarSheets(){
    if(!sheetsUrl) return;
    await conectarSheets(sheetsUrl,true);
    toast('Sincronizado con Google Sheets.');
  }

  async function enviarMovimientoASheets(ref,fecha,tipo,cantidad){
    var res=await fetch(sheetsUrl,{method:'POST',body:JSON.stringify({action:'addMovimiento',ref:ref,fecha:fecha,tipo:(tipo==='entrada'?'Entrada':'Salida'),cantidad:cantidad})});
    var json=await res.json();
    if(!json.ok) throw new Error(json.error||'Error al guardar en Sheets');
    serverProductos=json.productos.map(mapServerProduct);
  }

  // ── Modal ─────────────────────────────────────
  function openModal(html){ document.getElementById('modal-box').innerHTML=html; document.getElementById('modal-overlay').classList.add('show'); }
  function closeModal(){ document.getElementById('modal-overlay').classList.remove('show'); }
  document.getElementById('modal-overlay').addEventListener('click',function(e){ if(e.target.id==='modal-overlay') closeModal(); });

  // ── Tabs ──────────────────────────────────────
  var ALL_TABS=['inicio','dashboard','ventas','registrar','panel','alertas','proyeccion','temporadas','informe','proveedores','config'];
  function switchTab(tab){
    currentTab=tab;
    document.querySelectorAll('.tab').forEach(function(t){ t.classList.toggle('active',t.getAttribute('data-tab')===tab); });
    ALL_TABS.forEach(function(v){ document.getElementById('view-'+v).style.display=(v===tab)?'block':'none'; });
    var renders={inicio:renderInicioView,dashboard:renderDashboardView,ventas:renderVentasView,registrar:renderRegistrarView,panel:renderPanelView,alertas:renderAlertasView,proyeccion:renderProyeccionView,temporadas:renderTemporadasView,informe:renderInformeView,proveedores:renderProveedoresView,config:renderConfigView};
    if(renders[tab]) renders[tab]();
  }
  document.getElementById('tabs').addEventListener('click',function(e){
    var t=e.target.closest('.tab'); if(t) switchTab(t.getAttribute('data-tab'));
  });

  // ── Stats bar ────────────────────────────────
  function renderStats(){
    var all=computeAll();
    var pedir=all.filter(function(r){return r.alerta==='PEDIR YA';}).length;
    var ok=all.filter(function(r){return r.alerta==='OK';}).length;
    var sindato=all.filter(function(r){return r.alerta==='SIN DATO';}).length;
    document.getElementById('subLine').textContent=(connected?'🟢 Conectado a Sheets':'🔴 Modo local')+' · '+all.length+' productos';
    document.getElementById('statsRow').innerHTML=
      '<div class="stat red click-kpi" data-filter="PEDIR YA"><div class="num">'+pedir+'</div><div class="lbl">Pedir ya</div></div>'+
      '<div class="stat green click-kpi" data-filter="OK"><div class="num">'+ok+'</div><div class="lbl">OK</div></div>'+
      '<div class="stat gray click-kpi" data-filter="SIN DATO"><div class="num">'+sindato+'</div><div class="lbl">Sin dato</div></div>';
    document.querySelectorAll('#statsRow .click-kpi').forEach(function(card){
      card.style.cursor='pointer';
      card.addEventListener('click',function(){ alertFilter=card.getAttribute('data-filter'); switchTab('panel'); });
    });
  }

  function timelineItem(titulo, cuerpo, estado){
    var isCompleto = estado.indexOf('✅')===0;
    var isDisp = estado.indexOf('🔵')===0;
    var dotColor = isCompleto ? '#2F9E5B' : '#2563EB';
    var tagBg = isCompleto ? 'rgba(47,158,91,.15)' : 'rgba(37,99,235,.15)';
    var tagColor = isCompleto ? '#4ADE80' : '#60A5FA';
    return '<div style="position:relative;margin-bottom:22px;padding-left:0;">'+
      '<div style="position:absolute;left:-23px;top:3px;width:12px;height:12px;border-radius:50%;background:'+dotColor+';border:2px solid #0A0F1E;box-shadow:0 0 0 2px '+dotColor+';"></div>'+
      '<div style="display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap;">'+
        '<div style="flex:1;min-width:180px;">'+
          '<div style="font-size:13.5px;font-weight:700;color:#fff;margin-bottom:3px;">'+titulo+'</div>'+
          '<div style="font-size:12.5px;color:#8896AF;line-height:1.55;">'+cuerpo+'</div>'+
        '</div>'+
        '<span style="flex-shrink:0;font-size:10.5px;font-weight:700;background:'+tagBg+';color:'+tagColor+';padding:3px 10px;border-radius:100px;letter-spacing:.03em;white-space:nowrap;">'+estado+'</span>'+
      '</div>'+
    '</div>';
  }

  function featureItem(texto){
    return '<div style="display:flex;align-items:flex-start;gap:8px;padding:6px 0;border-bottom:1px solid var(--line);">'+
      '<span style="color:var(--green);font-size:14px;flex-shrink:0;margin-top:1px;">✓</span>'+
      '<span style="font-size:12.5px;color:var(--ink);line-height:1.45;">'+texto+'</span>'+
    '</div>';
  }

  function renderVentasTabla(){
    var box=document.getElementById('ventas-content');
    if(!box) return;

    var datos=PRODUCTS_RAW.map(function(p){
      return { ref:p.ref, nombre:p.nombre, canal:p.canal, consumo:getConsumoEnPeriodo(p) };
    }).filter(function(d){ return d.consumo>0; })
      .sort(function(a,b){ return b.consumo-a.consumo; });

    if(!datos.length){
      box.innerHTML='<div class="empty">No hay datos de consumo para este período.</div>';
      return;
    }

    var top20=datos.slice(0,20);
    var maxConsumoPeriodo=top20[0].consumo;

    var unidad=periodoActivo==='dia'?'u/día':periodoActivo==='mes'?'u/mes':periodoActivo==='trimestre'?'u/trim.':'u/sem.';

    var rows=top20.map(function(d,idx){
      var rankClass=idx===0?'gold':idx===1?'silver':idx===2?'bronze':'';
      var pct=Math.round((d.consumo/maxConsumoPeriodo)*100);
      var barColor=idx<3?'var(--amber)':(idx<10?'var(--navy)':'var(--muted)');
      return '<tr>'+
        '<td><span class="rank-num '+rankClass+'">'+(idx+1)+'</span></td>'+
        '<td>'+escapeHtml(d.ref)+'</td>'+
        '<td>'+escapeHtml(d.nombre)+'</td>'+
        '<td>'+escapeHtml(d.canal)+'</td>'+
        '<td class="num-cell" style="font-weight:700;">'+Math.round(d.consumo).toLocaleString('es-CO')+' <span style="color:var(--muted);font-size:10.5px;font-weight:400;">'+unidad+'</span></td>'+
        '<td style="width:140px;"><div style="background:var(--gray-soft);border-radius:4px;height:8px;"><div style="background:'+barColor+';width:'+pct+'%;height:8px;border-radius:4px;"></div></div></td>'+
        '</tr>';
    }).join('');

    var totalConsumo=datos.reduce(function(a,d){return a+d.consumo;},0);
    var top5Pct=Math.round((top20.slice(0,5).reduce(function(a,d){return a+d.consumo;},0)/totalConsumo)*100);

    box.innerHTML=
      '<div style="display:flex;gap:16px;margin-bottom:16px;flex-wrap:wrap;">'+
        '<div class="stat2" style="min-width:160px;"><div class="kpi-icon" style="background:var(--amber-soft);color:var(--amber);">📦</div><div class="num">'+datos.length+'</div><div class="lbl">SKUs con ventas</div></div>'+
        '<div class="stat2" style="min-width:160px;"><div class="kpi-icon" style="background:var(--blue-soft);color:var(--blue);">📈</div><div class="num">'+Math.round(totalConsumo).toLocaleString('es-CO')+'</div><div class="lbl">Unidades '+(unidad)+'</div></div>'+
        '<div class="stat2" style="min-width:160px;"><div class="kpi-icon" style="background:var(--purple-soft);color:var(--purple);">🏅</div><div class="num">'+top5Pct+'%</div><div class="lbl">Top 5 del total</div></div>'+
      '</div>'+
      '<div class="table-scroll">'+
        '<table><thead><tr><th>#</th><th>Ref.</th><th>Producto</th><th>Canal</th><th>Consumo</th><th>Participación</th></tr></thead>'+
        '<tbody>'+rows+'</tbody></table>'+
      '</div>'+
      '<p class="hint" style="margin-top:12px;">💡 Los top 5 representan el <strong>'+top5Pct+'%</strong> del consumo total en este período. Prioriza su reabastecimiento.</p>';
  }

  function kpiCard2(icon,num,label,cls,filterValue){

  function renderRegistrarView(){
    var el=document.getElementById('view-registrar');
    el.innerHTML=
      '<div class="panel">'+
        '<h2>Registrar movimiento de inventario</h2>'+
        '<p class="desc">Registra cada consumo o entrada. El stock y los KPIs se recalculan automáticamente.</p>'+
        '<div class="row cols-4">'+
          '<div class="field"><label>Producto</label><input id="mv-ref" list="productList" placeholder="Escribe referencia o nombre…" autocomplete="off"></div>'+
          '<div class="field"><label>Fecha</label><input id="mv-fecha" type="date"></div>'+
          '<div class="field"><label>Tipo</label><select id="mv-tipo"><option value="salida">Consumo (salida)</option><option value="entrada">Entrada / recepción</option></select></div>'+
          '<div class="field"><label>Cantidad</label><input id="mv-cantidad" type="number" min="0" step="1" placeholder="0"></div>'+
        '</div>'+
        '<button class="btn btn-primary" id="mv-save">Guardar movimiento</button>'+
      '</div>'+
      '<div class="panel"><h2>Últimos movimientos de esta sesión</h2><div id="mv-list"></div></div>';

    document.getElementById('mv-fecha').value=todayISO();
    document.getElementById('mv-save').addEventListener('click',async function(){
      var refInput=document.getElementById('mv-ref').value.trim();
      var fecha=document.getElementById('mv-fecha').value;
      var tipo=document.getElementById('mv-tipo').value;
      var cantidad=parseFloat(document.getElementById('mv-cantidad').value);
      var product=matchProduct(refInput);
      if(!product){ toast('No encontré ese producto. Selecciona uno de la lista.'); return; }
      if(!fecha){ toast('Selecciona una fecha.'); return; }
      if(!cantidad||cantidad<=0){ toast('Ingresa una cantidad válida.'); return; }
      var saveBtn=document.getElementById('mv-save');
      if(connected){
        saveBtn.disabled=true; saveBtn.textContent='Guardando en Sheets…';
        try{
          await enviarMovimientoASheets(product.ref,fecha,tipo,cantidad);
          sessionLog.unshift({ref:product.ref,nombre:product.nombre,fecha:fecha,tipo:tipo,cantidad:cantidad});
          renderStats(); renderMovList();
          toast('Guardado en Sheets: '+(tipo==='entrada'?'entrada':'consumo')+' de '+cantidad+' — '+product.nombre);
        }catch(e){ toast('No se pudo guardar en Sheets.'); }
        saveBtn.disabled=false; saveBtn.textContent='Guardar movimiento';
      } else {
        state.movimientos.push({id:'m'+Date.now()+Math.random().toString(36).slice(2,7),ref:product.ref,fecha:fecha,tipo:tipo,cantidad:cantidad});
        saveState(); renderStats(); renderMovList();
        toast('Movimiento guardado: '+cantidad+' — '+product.nombre);
      }
      document.getElementById('mv-cantidad').value='';
      document.getElementById('mv-ref').value='';
    });
    renderMovList();
  }

  function matchProduct(input){
    if(!input) return null;
    var dashIdx=input.indexOf(' — ');
    if(dashIdx>0){ var refPart=input.slice(0,dashIdx).trim(); var found=PRODUCTS_RAW.find(function(p){return p.ref===refPart;}); if(found) return found; }
    var exact=PRODUCTS_RAW.find(function(p){return p.ref===input;}); if(exact) return exact;
    var lower=input.toLowerCase();
    return PRODUCTS_RAW.find(function(p){return(p.ref+' — '+p.nombre).toLowerCase()===lower;})||PRODUCTS_RAW.find(function(p){return p.nombre.toLowerCase()===lower;});
  }

  function renderMovList(){
    var box=document.getElementById('mv-list'); if(!box) return;
    if(connected){
      if(!sessionLog.length){ box.innerHTML='<div class="empty">Sin movimientos en esta sesión. El historial completo está en Google Sheets.</div>'; return; }
      var rowsConn=sessionLog.slice(0,25).map(function(m){
        return '<tr><td>'+fmtDate(new Date(m.fecha+'T00:00:00'))+'</td><td>'+escapeHtml(m.nombre)+'</td><td>'+(m.tipo==='entrada'?'<span class="badge ok">Entrada</span>':'<span class="badge sindato">Consumo</span>')+'</td><td class="num-cell">'+m.cantidad+'</td></tr>';
      }).join('');
      box.innerHTML='<div class="table-scroll"><table><thead><tr><th>Fecha</th><th>Producto</th><th>Tipo</th><th>Cantidad</th></tr></thead><tbody>'+rowsConn+'</tbody></table></div>';
      return;
    }
    var list=state.movimientos.slice().sort(function(a,b){return(b.fecha+b.id).localeCompare(a.fecha+a.id);}).slice(0,25);
    if(!list.length){ box.innerHTML='<div class="empty">Todavía no hay movimientos registrados.</div>'; return; }
    var byRef={}; PRODUCTS_RAW.forEach(function(p){byRef[p.ref]=p;});
    var rows=list.map(function(m){

  function renderPanelTable(){
    var all=computeAll();
    if(searchTerm){ var s=searchTerm.toLowerCase(); all=all.filter(function(r){return r.ref.toLowerCase().indexOf(s)>=0||r.nombre.toLowerCase().indexOf(s)>=0;}); }
    if(alertFilter==='VENCIDO') all=all.filter(function(r){return r.vencido;});
    else if(alertFilter) all=all.filter(function(r){return r.alerta===alertFilter;});
    all.sort(function(a,b){
      var av=a[sortState.col],bv=b[sortState.col];
      if(av instanceof Date||bv instanceof Date){av=av?av.getTime():Infinity;bv=bv?bv.getTime():Infinity;}
      if(typeof av==='string'){var c=av.localeCompare(bv);return sortState.dir==='asc'?c:-c;}
      var c2=(av||0)-(bv||0); return sortState.dir==='asc'?c2:-c2;
    });
    document.getElementById('pf-count').textContent=all.length+' de '+PRODUCTS_RAW.length+' productos';
    var head='<thead><tr>'+PANEL_COLS.map(function(c){var arrow=sortState.col===c.key?(sortState.dir==='asc'?' ▲':' ▼'):'';return'<th data-col="'+c.key+'">'+c.label+arrow+'</th>';}).join('')+'</tr></thead>';
    var body=all.map(function(r){

  //  VISTA: PROYECCIÓN
  // ══════════════════════════════════════════════
  // ── Proyección inteligente ────────────────────
  // Calcula el stock mes a mes inyectando el tránsito en el mes exacto
  // de llegada (según lead time del proveedor) y opcionalmente un pedido
  // colocado hoy que también llegaría en lead-time meses.
  function projectMonthsSmart(r, nMeses){
    nMeses = nMeses || proyMesesFuturos;
    var leadTime = r.leadTime || 120;
    var avgDaily  = r.avgDaily || 0;
    var stock     = r.stockActual; // tránsito NO sumado: lo inyectamos en su mes

    // ¿En qué mes (base 1) llega el tránsito existente?
    // Si el tránsito ya está en camino asumimos que llega en el mes que
    // corresponde al lead time restante; como no tenemos fecha exacta de pedido
    // usamos leadTime/30 como aproximación conservadora.
    var mesLlegadaTransito = Math.ceil(leadTime / 30);

    // ¿En qué mes llegaría un pedido colocado HOY?
    var mesLlegadaPedidoHoy = Math.ceil(leadTime / 30);

    var months = [];
    var stockAcum = stock;
    for (var i = 1; i <= nMeses; i++) {
      // Inyectar tránsito existente en su mes de llegada
      if (i === mesLlegadaTransito && r.transito > 0) {
        stockAcum += r.transito;
      }
      // Descontar consumo del mes
      var consumoMes = avgDaily > 0 ? avgDaily * 30 : 0;
      stockAcum = Math.max(0, Math.round(stockAcum - consumoMes));
      months.push(avgDaily > 0 ? stockAcum : null);
    }
    return months;
  }

  // Compatibilidad con código antiguo que llama projectMonths
  function projectMonths(r){ return projectMonthsSmart(r, 6); }

    el.innerHTML=

  function renderProyeccionRiesgo(){
    var all = computeAll();
    var nM = proyMesesFuturos;
    var counts = Array(nM).fill(0);
    var countsBajos = Array(nM).fill(0);

    all.forEach(function(r){
      var months = projectMonthsSmart(r, nM);
      months.forEach(function(v, idx){
        if (v === 0) counts[idx]++;
        else if (v !== null && r.avgDaily > 0 && v < r.avgDaily * 30) countsBajos[idx]++;
      });
    });

    var maxVal = Math.max.apply(null, counts.map(function(c,i){ return c+countsBajos[i]; }).concat([1]));
    var hoy = new Date();

    var bars = counts.map(function(c, idx){
      var bajo = countsBajos[idx];
      var totalPct = Math.max(((c+bajo)/maxVal)*100, 2);
      var critPct  = Math.max((c/maxVal)*100, c>0?2:0);
      var mejPct   = Math.max((bajo/maxVal)*100, bajo>0?2:0);
      var mesDate  = new Date(hoy.getFullYear(), hoy.getMonth() + idx + 1, 1);
      var mesLabel = mesDate.toLocaleDateString('es-CO', {month:'short', year:'2-digit'});
      return '<div style="flex:1;text-align:center;min-width:60px;">'+
        '<div style="height:90px;display:flex;align-items:flex-end;flex-direction:column;justify-content:flex-end;">'+
          '<div style="width:100%;background:var(--amber);border-radius:4px 4px 0 0;height:'+mejPct+'%;min-height:'+(bajo>0?'4px':'0')+';"></div>'+
          '<div style="width:100%;background:var(--red);border-radius:'+(bajo>0?'0':'4px 4px')+' 0 0;height:'+critPct+'%;min-height:'+(c>0?'4px':'0')+';"></div>'+
        '</div>'+
        '<div class="hint" style="margin-top:4px;font-size:11px;font-weight:700;color:var(--red);">'+(c>0?c+'🔴':'-')+'</div>'+
        '<div class="hint" style="font-size:10px;color:var(--amber);">'+(bajo>0?bajo+'🟡':'')+'</div>'+
        '<div class="hint" style="margin-top:2px;font-size:11px;font-weight:600;">'+mesLabel+'</div>'+
      '</div>';
    }).join('');

    var riesgoEl = document.getElementById('proy-riesgo');
    if (!riesgoEl) return;
    riesgoEl.innerHTML=
      '<div style="display:flex;gap:12px;margin-bottom:8px;flex-wrap:wrap;">'+
        '<div style="font-size:12.5px;color:var(--muted);"><span style="display:inline-block;width:10px;height:10px;background:var(--red);border-radius:2px;margin-right:4px;"></span>Stock en cero</div>'+
        '<div style="font-size:12.5px;color:var(--muted);"><span style="display:inline-block;width:10px;height:10px;background:var(--amber);border-radius:2px;margin-right:4px;"></span>Stock bajo (&lt; 1 mes consumo)</div>'+
      '</div>'+
      '<div style="display:flex;gap:6px;align-items:flex-end;padding:6px 0 4px;">'+bars+'</div>';
  }

  function renderProyeccionTable(){
    var all = computeAll();
    if (proySearch){ var s=proySearch.toLowerCase(); all=all.filter(function(r){ return r.ref.toLowerCase().indexOf(s)>=0||r.nombre.toLowerCase().indexOf(s)>=0; }); }

    // Filtrar por historial de fechas si está activo
    if (proyFechaDesde || proyFechaHasta) {
      var desde = proyFechaDesde ? new Date(proyFechaDesde+'T00:00:00') : null;
      var hasta = proyFechaHasta ? new Date(proyFechaHasta+'T23:59:59') : null;
      // Marcamos cuáles tienen movimientos en el rango — solo afecta el orden, no la proyección
      all = all.map(function(r){
        var movEnRango = state.movimientos.filter(function(m){
          if (m.ref !== r.ref) return false;
          var d = new Date(m.fecha+'T00:00:00');
          if (desde && d < desde) return false;
          if (hasta && d > hasta) return false;
          return true;
        });
        r._movRango = movEnRango.length;
        return r;
      });
    }

    all.sort(function(a,b){ return a.diasCobertura - b.diasCobertura; });
    var nM = proyMesesFuturos;
    var hoy = new Date();

    // Calcular mes de llegada del tránsito para colorear la columna
    var getMesTransito = function(r){ return r.leadTime ? Math.ceil(r.leadTime/30) : Math.ceil(120/30); };

    var head = '<thead><tr>'+
      '<th>Ref.</th><th>Producto</th><th>Canal</th>'+
      '<th class="num-cell">Stock hoy</th>'+
      '<th class="num-cell">Tránsito</th>'+
      '<th class="num-cell">Llega en</th>'+
      Array.from({length:nM}, function(_,i){
        var mesDate = new Date(hoy.getFullYear(), hoy.getMonth()+i+1, 1);
        var mesLabel = mesDate.toLocaleDateString('es-CO', {month:'short', year:'2-digit'});
        return '<th class="num-cell">'+mesLabel+'</th>';
      }).join('')+
      '<th class="num-cell">Agotado el</th>'+
      '</tr></thead>';

    var body = all.map(function(r){
      var months = projectMonthsSmart(r, nM);
      var mesTransito = r.transito > 0 ? getMesTransito(r) : -1;
      var cells = months.map(function(v, idx){
        if (v === null) return '<td class="num-cell">—</td>';
        var mesIdx = idx + 1; // 1-based
        var esTransito = (mesIdx === mesTransito && r.transito > 0);
        var style = '';
        if (esTransito) style += 'background:#DBEAFE;';
        if (v === 0) style += 'color:var(--red);font-weight:700;';
        else if (r.avgDaily > 0 && v < r.avgDaily * 30) style += 'color:var(--amber);font-weight:600;';
        var marker = esTransito ? ' 📦' : '';
        return '<td class="num-cell" style="'+style+'" title="'+(esTransito?'Llega el tránsito este mes':'')+'">'+v+marker+'</td>';
      }).join('');

      var llegaLabel = r.transito > 0 ? 'Mes +'+getMesTransito(r) : '—';
      var llegaStyle = r.transito > 0 ? 'color:var(--blue);font-weight:600;font-size:11px;' : 'color:var(--muted);';

      return '<tr class="row-click" data-ref="'+escapeHtml(r.ref)+'" title="Click para ver detalle">'+
        '<td>'+escapeHtml(r.ref)+'</td>'+
        '<td>'+escapeHtml(r.nombre)+'</td>'+
        '<td>'+escapeHtml(r.canal)+'</td>'+
        '<td class="num-cell">'+Math.round(r.stockActual)+'</td>'+
        '<td class="num-cell" style="'+(r.transito>0?'color:var(--blue);font-weight:600;':'')+'">'+
          (r.transito > 0 ? '+'+Math.round(r.transito) : '—')+'</td>'+
        '<td class="num-cell" style="'+llegaStyle+'">'+llegaLabel+'</td>'+
        cells+
        '<td class="num-cell">'+fmtDate(r.fechaAgotado)+'</td>'+
        '</tr>';
    }).join('');

    if (!all.length) body='<tr><td colspan="'+(6+nM)+'"><div class="empty">Sin resultados.</div></td></tr>';
    document.getElementById('proy-table').innerHTML='<table>'+head+'<tbody>'+body+'</tbody></table>';

    document.querySelectorAll('#proy-table tr[data-ref]').forEach(function(tr){
      tr.addEventListener('click', function(){ abrirDetalleProducto(tr.getAttribute('data-ref')); });
    });
  }

  // ══════════════════════════════════════════════
  //  VISTA: TEMPORADAS — estacionalidad + sugerencias
  // ══════════════════════════════════════════════
  function renderTemporadasView(){
    var el = document.getElementById('view-temporadas');
    if (typeof Chart === 'undefined'){
      el.innerHTML = '<div class="panel"><h2>🌦️ Temporadas</h2><p class="desc">Chart.js no cargó. Recarga la página.</p></div>';
      return;
    }

    // ── Datos: construimos un historial mensual simulado desde los 3 meses embebidos
    // (Mayo=idx0, Junio=idx1, Julio=idx2) + los movimientos registrados.
    // Para estacionalidad mes-a-mes usamos los m[] de cada producto como base.
    var MESES_HIST = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
    var MESES_FULL = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];

    // El historial embebido cubre mayo (m[0]), junio (m[1]), julio (m[2]) de 2026.
    // Asumimos consumo estacional relativo basado en ese historial.
    // Para construir una curva de 12 meses usamos un factor estacional estándar
    // de iluminación LED (alta en temporadas escolares y fin de año, baja en vacaciones).
    var FACTOR_ESTACIONAL = [0.80, 0.75, 0.85, 0.90, 1.00, 1.00, 1.05, 0.90, 1.10, 1.00, 1.20, 1.35];
    // Ajustamos para que el promedio de los 3 meses embebidos corresponda a los reales
    // (mayo idx=4, junio idx=5, julio idx=6).

    // Calcular consumo total mensual embebido
    var totalMay = 0, totalJun = 0, totalJul = 0;
    PRODUCTS_RAW.forEach(function(p){
      if (typeof p.m[0]==='number' && p.m[0]>0) totalMay += p.m[0];
      if (typeof p.m[1]==='number' && p.m[1]>0) totalJun += p.m[1];
      if (typeof p.m[2]==='number' && p.m[2]>0) totalJul += p.m[2];
    });
    var promedioReal = (totalMay + totalJun + totalJul) / 3;
    var promedioFactor = (FACTOR_ESTACIONAL[4] + FACTOR_ESTACIONAL[5] + FACTOR_ESTACIONAL[6]) / 3;
    var baseAnual = promedioReal / promedioFactor; // consumo base normalizado mensual

    // Construir curva de 12 meses (año completo estimado)
    var consumoAnual = FACTOR_ESTACIONAL.map(function(f){ return Math.round(baseAnual * f); });
    // Reemplazar mayo/jun/jul con valores reales
    consumoAnual[4] = totalMay;
    consumoAnual[5] = totalJun;
    consumoAnual[6] = totalJul;

    // ── Top 5 productos por consumo total (para análisis individual)
    var topProds = PRODUCTS_RAW.map(function(p){
      var total = p.m.filter(function(v){ return typeof v==='number'&&v>0; }).reduce(function(a,b){return a+b;},0);
      return { ref:p.ref, nombre:p.nombre, canal:p.canal, total:total, m:p.m };
    }).filter(function(d){ return d.total>0; }).sort(function(a,b){return b.total-a.total;}).slice(0,5);

    // ── Identificar pico y valle estacional
    var maxMes = consumoAnual.indexOf(Math.max.apply(null,consumoAnual));
    var minMes = consumoAnual.indexOf(Math.min.apply(null,consumoAnual));

    // ── Calcular cuándo hacer el pedido para cada pico estacional
    // Si el pico es en diciembre y lead time = 120 días → pedir en agosto
    function mesParaPedir(mesPico){
      var leadTimeMeses = Math.ceil(120/30); // 4 meses
      var mesPedido = mesPico - leadTimeMeses;
      if (mesPedido < 0) mesPedido += 12;
      return mesPedido;
    }

    // Picos secundarios: meses >= 110% del promedio
    var promedioMes = consumoAnual.reduce(function(a,b){return a+b;},0)/12;
    var picosMeses = consumoAnual.map(function(c,i){ return {mes:i,consumo:c,esPico:c>=promedioMes*1.1}; }).filter(function(x){return x.esPico;});

    el.innerHTML =
      '<div class="panel">'+
        '<h2>🌦️ Temporadas y estacionalidad</h2>'+
        '<p class="desc">Análisis de los meses de mayor y menor demanda, con recomendaciones de cuándo hacer los pedidos para llegar a tiempo a cada pico. Lead time del proveedor: <strong>120 días (4 meses)</strong>.</p>'+

        '<!-- KPIs de temporada -->'+
        '<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px;">'+
          '<div class="stat2" style="border-left:4px solid var(--red);">'+
            '<div class="kpi-icon" style="background:var(--red-soft);color:var(--red);">🔥</div>'+
            '<div class="num">'+MESES_FULL[maxMes]+'</div>'+
            '<div class="lbl">Mes pico de demanda</div>'+
          '</div>'+
          '<div class="stat2" style="border-left:4px solid var(--blue);">'+
            '<div class="kpi-icon" style="background:var(--blue-soft);color:var(--blue);">📦</div>'+
            '<div class="num">'+MESES_FULL[mesParaPedir(maxMes)]+'</div>'+
            '<div class="lbl">Pedir para llegar al pico</div>'+
          '</div>'+
          '<div class="stat2" style="border-left:4px solid var(--green);">'+
            '<div class="kpi-icon" style="background:var(--green-soft);color:var(--green);">❄️</div>'+
            '<div class="num">'+MESES_FULL[minMes]+'</div>'+
            '<div class="lbl">Mes de menor demanda</div>'+
          '</div>'+
          '<div class="stat2" style="border-left:4px solid var(--amber);">'+
            '<div class="kpi-icon" style="background:var(--amber-soft);color:var(--amber);">📈</div>'+
            '<div class="num">'+(Math.round((consumoAnual[maxMes]/consumoAnual[minMes]-1)*100))+'%</div>'+
            '<div class="lbl">Diferencia pico vs. valle</div>'+
          '</div>'+
        '</div>'+

        '<!-- Gráfico curva estacional -->'+
        '<div class="chart-card" style="margin-bottom:20px;">'+
          '<h3>📊 Curva de consumo mensual estimada (12 meses)</h3>'+
          '<p class="chart-desc">Mayo, junio y julio son datos reales. Los demás son estimaciones estacionales. <strong>👆 Click en cualquier barra</strong> para ver qué productos la componen y su ranking de consumo.</p>'+
          '<div class="chart-canvas-wrap" style="height:280px;"><canvas id="chart-estacional"></canvas></div>'+
        '</div>'+

        '<!-- Tabla de alertas estacionales -->'+
        '<div class="chart-card" style="margin-bottom:20px;">'+
          '<h3>🗓️ Calendario de pedidos sugeridos por temporada</h3>'+
          '<p class="chart-desc">Para cada mes de alta demanda, el sistema calcula cuándo debe hacerse el pedido teniendo en cuenta el lead time de 4 meses.</p>'+
          '<table style="margin-top:10px;">'+
            '<thead><tr><th>Mes pico</th><th>Consumo estimado</th><th>vs. promedio</th><th>Pedir en</th><th>Urgencia</th><th>Recomendación</th></tr></thead>'+
            '<tbody id="tabla-temporadas"></tbody>'+
          '</table>'+
        '</div>'+

        '<!-- Análisis por producto top 5 -->'+
        '<div class="chart-card">'+
          '<h3>🏆 Estacionalidad de los 5 productos más vendidos</h3>'+
          '<p class="chart-desc">Consumo mensual de los top 5 SKUs en el historial disponible. Mayo, junio y julio son valores reales.</p>'+
          '<div class="chart-canvas-wrap" style="height:260px;"><canvas id="chart-estacional-top5"></canvas></div>'+
        '</div>'+
      '</div>';

    // ── Llenar tabla de pedidos por temporada ──
    var hoy = new Date();
    var mesHoy = hoy.getMonth(); // 0-based
    var tbody = document.getElementById('tabla-temporadas');
    tbody.innerHTML = picosMeses.map(function(p){
      var mesPedido = mesParaPedir(p.mes);
      var diffMeses = mesPedido - mesHoy;
      if (diffMeses < 0) diffMeses += 12;
      var urgencia, urgStyle, recomendacion;
      if (diffMeses <= 0){
        urgencia = '🔴 Pedir YA'; urgStyle='color:var(--red);font-weight:700;';
        recomendacion = 'El plazo ideal ya pasó. Coloca el pedido de inmediato para minimizar el faltante.';
      } else if (diffMeses <= 1){
        urgencia = '🟠 Urgente'; urgStyle='color:var(--amber);font-weight:700;';
        recomendacion = 'Tienes menos de 1 mes para hacer el pedido. Prioriza este lote.';
      } else if (diffMeses <= 2){
        urgencia = '🟡 Próximo'; urgStyle='color:#D97706;font-weight:600;';
        recomendacion = 'Tienes '+diffMeses+' meses. Prepara la orden de compra en las próximas semanas.';
      } else {
        urgencia = '🟢 Con tiempo'; urgStyle='color:var(--green);';
        recomendacion = 'Tienes '+diffMeses+' meses para preparar el pedido sin prisa.';
      }
      var pct = Math.round((p.consumo/promedioMes-1)*100);
      return '<tr>'+
        '<td><strong>'+MESES_FULL[p.mes]+'</strong></td>'+
        '<td class="num-cell">'+p.consumo.toLocaleString('es-CO')+' u</td>'+
        '<td class="num-cell" style="color:var(--red);font-weight:600;">+'+pct+'%</td>'+
        '<td><strong>'+MESES_FULL[mesPedido]+'</strong></td>'+
        '<td style="'+urgStyle+'">'+urgencia+'</td>'+
        '<td style="font-size:12px;color:var(--muted);">'+recomendacion+'</td>'+
        '</tr>';
    }).join('') || '<tr><td colspan="6"><div class="empty">No se detectaron picos estacionales significativos con el historial actual.</div></td></tr>';

    // ── Construir desglose de productos por mes para el drill-down ──
    // Para los 3 meses reales usamos p.m[] directamente.
    // Para los meses estimados escalamos cada producto con el mismo factor estacional.
    var desgloseProductosPorMes = Array.from({length:12}, function(_, mesIdx){
      return PRODUCTS_RAW.map(function(p){
        var consumo;
        if (mesIdx === 4) consumo = (typeof p.m[0]==='number'&&p.m[0]>0) ? p.m[0] : 0;
        else if (mesIdx === 5) consumo = (typeof p.m[1]==='number'&&p.m[1]>0) ? p.m[1] : 0;
        else if (mesIdx === 6) consumo = (typeof p.m[2]==='number'&&p.m[2]>0) ? p.m[2] : 0;
        else {
          // Estimado: usar promedio histórico del producto * factor del mes
          var histVals = p.m.filter(function(v){ return typeof v==='number'&&v>0; });
          var avgMes = histVals.length ? histVals.reduce(function(a,b){return a+b;},0)/histVals.length : 0;
          var promedioFactor2 = (FACTOR_ESTACIONAL[4]+FACTOR_ESTACIONAL[5]+FACTOR_ESTACIONAL[6])/3;
          consumo = promedioFactor2 > 0 ? Math.round(avgMes * (FACTOR_ESTACIONAL[mesIdx] / promedioFactor2)) : 0;
        }
        return { ref:p.ref, nombre:p.nombre, canal:p.canal, consumo:consumo };
      }).filter(function(d){ return d.consumo > 0; })
        .sort(function(a,b){ return b.consumo - a.consumo; });
    });

    // ── Modal de desglose por mes ──
    function abrirDesgloseMes(mesIdx){
      var esReal = mesIdx >= 4 && mesIdx <= 6;
      var items = desgloseProductosPorMes[mesIdx];
      var totalMes = items.reduce(function(a,d){ return a+d.consumo; },0);
      var mesPedido = mesParaPedir(mesIdx);
      var esPico = consumoAnual[mesIdx] >= promedioMes * 1.1;

      // Top 10 para la tabla; resto agrupado
      var top10 = items.slice(0, 20);
      var acum = 0;

      var rows = top10.map(function(d, idx){
        acum += d.consumo;
        var pct = totalMes > 0 ? (d.consumo/totalMes*100) : 0;
        var acumPct = totalMes > 0 ? (acum/totalMes*100) : 0;
        var rankClass = idx===0?'gold':idx===1?'silver':idx===2?'bronze':'';
        var barW = Math.round(pct);
        return '<tr>'+
          '<td><span class="rank-num '+rankClass+'" style="width:20px;height:20px;font-size:10px;">'+(idx+1)+'</span></td>'+
          '<td style="font-size:11.5px;font-family:var(--mono);">'+escapeHtml(d.ref)+'</td>'+
          '<td style="font-size:12px;max-width:260px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">'+escapeHtml(d.nombre)+'</td>'+
          '<td style="font-size:11px;color:var(--muted);">'+escapeHtml(d.canal)+'</td>'+
          '<td class="num-cell" style="font-weight:700;">'+d.consumo.toLocaleString('es-CO')+'</td>'+
          '<td style="width:100px;">'+
            '<div style="background:var(--gray-soft);border-radius:4px;height:6px;">'+

            '</div>'+
            '<div style="font-size:10px;color:var(--muted);margin-top:2px;">'+pct.toFixed(1)+'% · acum '+acumPct.toFixed(0)+'%</div>'+
          '</td>'+
          '</tr>';
      }).join('');

      var restante = items.length > 20 ? items.slice(20).reduce(function(a,d){return a+d.consumo;},0) : 0;

      }

      // Pareto: productos que suman el 80%
      var acum80 = 0, n80 = 0;

            '<div style="font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);">SKUs con ventas</div>'+
            '<div style="font-size:20px;font-weight:800;font-family:var(--mono);color:var(--ink);">'+items.length+'</div>'+
            '<div style="font-size:11px;color:var(--muted);">referencias activas</div>'+
          '</div>'+
          '<div style="background:'+(esPico?'var(--red-soft)':'var(--green-soft)')+';border-radius:8px;padding:10px 14px;">'+
            '<div style="font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);">Pareto 80%</div>'+
            '<div style="font-size:20px;font-weight:800;font-family:var(--mono);color:'+(esPico?'var(--red)':'var(--green)')+';">'+n80+' SKU</div>'+

            '📦 <strong>Recomendación:</strong> Este mes supera el promedio en '+

            'Para tener stock disponible en <strong>'+MESES_FULL[mesIdx]+'</strong>, el pedido debe colocarse en '+

            'Considera pedir un <strong>'+Math.round((consumoAnual[mesIdx]/promedioMes-1)*100)+'% adicional</strong> sobre tu pedido normal.'+
          '</div>' : '')+

        '<h3 style="font-size:13px;margin:0 0 8px;color:var(--ink);">Ranking de productos — '+MESES_FULL[mesIdx]+'</h3>'+
        '<div style="max-height:400px;overflow:auto;border:1px solid var(--line);border-radius:8px;">'+

            '</tr></thead>'+
            '<tbody>'+rows+'</tbody>'+
          '</table>'+
        '</div>'
      );
      document.getElementById('modal-close-btn').addEventListener('click', closeModal);

    // ── Gráfico estacional ──
    if (document.getElementById('chart-estacional')){
      var ctx1 = document.getElementById('chart-estacional').getContext('2d');
      var lineaPromedio = Array(12).fill(Math.round(promedioMes));

  function renderInformeView(){

    var hoy=new Date(); var hoyStr=fmtDate(hoy);

    // Construir HTML del informe
    var htmlInforme=generarHtmlInforme(urgentes, hoy);

    el.innerHTML=
      '<div class="panel">'+
        '<h2>📧 Informe de reabastecimiento — listo para enviar</h2>'+
        '<p class="desc">Vista previa del informe que se envía al correo. Formato profesional, sustentación técnica por producto y descargable como HTML.</p>'+
        '<div style="display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;">'+

    document.getElementById('btn-descargar-informe').addEventListener('click',function(){
      var fullHtml='<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><title>ILUMAX · Informe de Reabastecimiento '+hoyStr+'</title>'+
        '<style>body{font-family:Arial,sans-serif;max-width:900px;margin:0 auto;padding:30px;color:#1F2430;}'+
        'h1{color:#14213D;border-bottom:3px solid #E8871E;padding-bottom:10px;}'+
        'h2{color:#14213D;margin-top:24px;}'+
        'h3{color:#14213D;font-size:14px;border-bottom:1px solid #E3E5EA;padding-bottom:4px;}'+
        'table{width:100%;border-collapse:collapse;margin-top:10px;font-size:13px;}'+
        'th{background:#14213D;color:#fff;padding:8px 10px;text-align:left;font-size:11px;}'+
        'td{padding:7px 10px;border-bottom:1px solid #E3E5EA;}'+
        'tr:nth-child(even) td{background:#F4F5F7;}'+
        '.badge-red{background:#FBE3E5;color:#D64550;padding:2px 8px;border-radius:100px;font-size:11px;font-weight:700;}'+

        '.footer{margin-top:40px;padding-top:16px;border-top:1px solid #E3E5EA;color:#737C8C;font-size:12px;}'+
        '</style></head><body>'+htmlInforme+'</body></html>';
      var blob=new Blob([fullHtml],{type:'text/html;charset=utf-8'});
      var url=URL.createObjectURL(blob);
      var a=document.createElement('a'); a.href=url;
      a.download='ILUMAX_Informe_Reabastecimiento_'+hoyStr.replace(/\//g,'-')+'.html';
      a.click(); URL.revokeObjectURL(url);

  function renderProveedoresView(){
    var el=document.getElementById('view-proveedores');
    if(!connected){
      el.innerHTML='<div class="panel"><h2>Proveedores</h2><p class="desc">Conéctate a Google Sheets para ver y administrar proveedores desde aquí.</p></div>';
      return;
    }
    el.innerHTML=
      '<div class="panel">'+
        '<h2>Agregar / editar proveedor</h2>'+
        '<p class="desc">Si el nombre ya existe, se actualiza; si no, se crea uno nuevo.</p>'+
        '<div class="row cols-4">'+
          '<div class="field"><label>Nombre del proveedor</label><input id="pv-nombre" placeholder="Ej: Proveedor China Directo"></div>'+
          '<div class="field"><label>Lead time (días)</label><input id="pv-leadtime" type="number" value="120"></div>'+
          '<div class="field"><label>Correo de contacto</label><input id="pv-contacto" type="email" placeholder="compras@proveedor.com"></div>'+
          '<div class="field"><label>Notas</label><input id="pv-notas" placeholder="Opcional"></div>'+
        '</div>'+
        '<button class="btn btn-primary" id="pv-save">Guardar proveedor</button>'+
      '</div>'+
      '<div class="panel"><h2>Proveedores registrados</h2><div class="table-scroll" id="pv-table"><div class="empty">Cargando…</div></div></div>';

    document.getElementById('pv-save').addEventListener('click',async function(){
      var nombre=document.getElementById('pv-nombre').value.trim();
      var leadTime=parseFloat(document.getElementById('pv-leadtime').value);
      var contacto=document.getElementById('pv-contacto').value.trim();
      var notas=document.getElementById('pv-notas').value.trim();
      if(!nombre){toast('Escribe el nombre del proveedor.');return;}
      var btn=document.getElementById('pv-save'); btn.disabled=true; btn.textContent='Guardando…';
      try{
        var res=await fetch(sheetsUrl,{method:'POST',body:JSON.stringify({action:'addProveedor',nombre:nombre,leadTime:leadTime||120,contacto:contacto,notas:notas})});
        var json=await res.json(); if(!json.ok) throw new Error(json.error||'error');
        toast('Proveedor guardado: '+nombre);
        document.getElementById('pv-nombre').value=''; document.getElementById('pv-contacto').value=''; document.getElementById('pv-notas').value='';
        renderTablaProveedores(json.proveedores); sincronizarSheets();
      }catch(e){toast('No se pudo guardar el proveedor.');}
      btn.disabled=false; btn.textContent='Guardar proveedor';
    });
    cargarProveedores();
  }

  async function cargarProveedores(){
    try{
      var res=await fetch(sheetsUrl+'?action=proveedores'); var json=await res.json();
      if(!json.ok) throw new Error(json.error||'error'); renderTablaProveedores(json.proveedores);
    }catch(e){ var box=document.getElementById('pv-table'); if(box) box.innerHTML='<div class="empty">No se pudo cargar la lista de proveedores.</div>'; }
  }

  function renderTablaProveedores(proveedores){
    var box=document.getElementById('pv-table'); if(!box) return;
    if(!proveedores||!proveedores.length){box.innerHTML='<div class="empty">Todavía no tienes proveedores registrados.</div>';return;}
    var rows=proveedores.map(function(p){
      return'<tr><td>'+escapeHtml(p.nombre)+'</td><td class="num-cell">'+p.leadTime+'</td><td>'+escapeHtml(p.contacto||'—')+'</td><td>'+escapeHtml(p.notas||'')+'</td>'+
        '<td style="white-space:nowrap;"><button class="btn-ghost" style="padding:5px 10px;font-size:12px;margin-right:6px;" data-edit-prov="'+escapeHtml(p.nombre)+'">Editar</button>'+
        '<button class="btn-danger-outline" data-del-prov="'+escapeHtml(p.nombre)+'">Eliminar</button></td></tr>';
    }).join('');
    box.innerHTML='<table><thead><tr><th>Proveedor</th><th>Lead time (días)</th><th>Contacto</th><th>Notas</th><th></th></tr></thead><tbody>'+rows+'</tbody></table>';
    document.querySelectorAll('[data-edit-prov]').forEach(function(btn){
      btn.addEventListener('click',function(){
        var prov=proveedores.find(function(x){return x.nombre===btn.getAttribute('data-edit-prov');}); if(!prov) return;
        document.getElementById('pv-nombre').value=prov.nombre;
        document.getElementById('pv-leadtime').value=prov.leadTime;
        document.getElementById('pv-contacto').value=prov.contacto||'';
        document.getElementById('pv-notas').value=prov.notas||'';
        document.getElementById('pv-nombre').scrollIntoView({behavior:'smooth',block:'center'});
        toast('Editando "'+prov.nombre+'" — cambia los datos y guarda.');
      });
    });
    document.querySelectorAll('[data-del-prov]').forEach(function(btn){
      btn.addEventListener('click',async function(){
        var nombre=btn.getAttribute('data-del-prov');
        if(!confirm('¿Eliminar el proveedor "'+nombre+'"?')) return;
        try{
          var res=await fetch(sheetsUrl,{method:'POST',body:JSON.stringify({action:'deleteProveedor',nombre:nombre})}); var json=await res.json();
          if(!json.ok) throw new Error(json.error||'error');
          toast('Proveedor eliminado.'); renderTablaProveedores(json.proveedores); sincronizarSheets();
        }catch(e){toast('No se pudo eliminar el proveedor.');}
      });
    });
  }
