  // ══════════════════════════════════════════════
  function renderConfigView(){
    var el=document.getElementById('view-config');
    if(connected){
      el.innerHTML='<div class="panel"><h2>Configuración general</h2><p class="desc">Se guarda directamente en tu Google Sheet.</p><div id="cfg-form"><div class="empty">Cargando configuración…</div></div></div>';
      cargarYRenderConfigConectada(); return;
    }
    el.innerHTML=
      '<div class="panel">'+
        '<h2>Configuración por producto</h2>'+
        '<p class="desc">Ajusta lead time, colchón de seguridad y tránsito de cada producto. Por defecto: 120 días de lead time y 30 de colchón.</p>'+
        '<div class="toolbar"><input type="text" id="cf-search" placeholder="Buscar por referencia o nombre…"></div>'+
        '<div class="table-scroll" id="cf-table"></div>'+
      '</div>';
    document.getElementById('cf-search').addEventListener('input',function(e){renderConfigTable(e.target.value);});
    renderConfigTable('');
  }

  async function cargarYRenderConfigConectada(){
    var box=document.getElementById('cfg-form');
    try{
      var res=await fetch(sheetsUrl+'?action=config'); var cfg=await res.json();
      if(!cfg.ok) throw new Error(cfg.error||'error');
      box.innerHTML=
        '<div class="row cols-3">'+
          '<div class="field"><label>Correo para alertas y pedidos</label><input id="cfg-correo" type="email" value="'+escapeHtml(cfg.correoAlertas||'')+'" placeholder="tu@ilumax.com"></div>'+
          '<div class="field"><label>Nivel de servicio objetivo</label><select id="cfg-nivel">'+['90%','95%','98%','99%'].map(function(v){return'<option value="'+v+'"'+(v===cfg.nivelServicio?' selected':'')+'>'+v+'</option>';}).join('')+'</select></div>'+
          '<div class="field"><label>Lead time por defecto (días)</label><input id="cfg-leadtime" type="number" value="'+(cfg.leadTimeDefecto||120)+'"></div>'+
        '</div>'+
        '<div class="row cols-3">'+
          '<div class="field"><label>Colchón mínimo (días)</label><input id="cfg-min" type="number" value="'+(cfg.colchonMinimo||15)+'"></div>'+
          '<div class="field"><label>Colchón máximo (días)</label><input id="cfg-max" type="number" value="'+(cfg.colchonMaximo||90)+'"></div>'+
          '<div class="field"><label>Colchón por defecto sin datos (días)</label><input id="cfg-fallback" type="number" value="'+(cfg.colchonFallback||30)+'"></div>'+
        '</div>'+
        '<button class="btn btn-primary" id="cfg-save">Guardar configuración</button>';

      document.getElementById('cfg-save').addEventListener('click',async function(){
        var btn=document.getElementById('cfg-save'); btn.disabled=true; btn.textContent='Guardando…';
        try{
          var body={action:'updateConfig',correoAlertas:document.getElementById('cfg-correo').value.trim(),nivelServicio:document.getElementById('cfg-nivel').value,leadTimeDefecto:parseFloat(document.getElementById('cfg-leadtime').value)||120,colchonMinimo:parseFloat(document.getElementById('cfg-min').value)||15,colchonMaximo:parseFloat(document.getElementById('cfg-max').value)||90,colchonFallback:parseFloat(document.getElementById('cfg-fallback').value)||30};
          var res2=await fetch(sheetsUrl,{method:'POST',body:JSON.stringify(body)}); var json2=await res2.json();
          if(!json2.ok) throw new Error(json2.error||'error');
          toast('Configuración guardada.'); await sincronizarSheets();
        }catch(e){toast('No se pudo guardar la configuración.');}
        btn.disabled=false; btn.textContent='Guardar configuración';
      });
    }catch(e){ if(box) box.innerHTML='<div class="empty">No se pudo cargar la configuración desde Sheets.</div>'; }
  }

  function renderConfigTable(filter){
    var list=PRODUCTS_RAW.slice();
    if(filter){var s=filter.toLowerCase();list=list.filter(function(p){return p.ref.toLowerCase().indexOf(s)>=0||p.nombre.toLowerCase().indexOf(s)>=0;});}
    var rows=list.map(function(p){
      var cfg=getConfig(p.ref); var transitoVal=cfg.transito!==null?cfg.transito:p.transito;
      return'<tr data-ref="'+escapeHtml(p.ref)+'"><td>'+escapeHtml(p.ref)+'</td><td>'+escapeHtml(p.nombre)+'</td>'+
        '<td><input type="number" class="cf-leadtime" value="'+cfg.leadTime+'" min="0" style="width:80px"></td>'+
        '<td><input type="number" class="cf-safety" value="'+cfg.safety+'" min="0" style="width:80px"></td>'+
        '<td><input type="number" class="cf-transito" value="'+transitoVal+'" min="0" style="width:90px"></td></tr>';
    }).join('');
    if(!list.length) rows='<tr><td colspan="5"><div class="empty">Sin resultados.</div></td></tr>';
    document.getElementById('cf-table').innerHTML='<table><thead><tr><th>Referencia</th><th>Producto</th><th>Lead time (días)</th><th>Colchón seguridad (días)</th><th>En tránsito</th></tr></thead><tbody>'+rows+'</tbody></table>';
    document.querySelectorAll('#cf-table tr[data-ref]').forEach(function(tr){
      var ref=tr.getAttribute('data-ref');
      function commit(){
        var lt=parseFloat(tr.querySelector('.cf-leadtime').value);
        var sf=parseFloat(tr.querySelector('.cf-safety').value);
        var tr_=parseFloat(tr.querySelector('.cf-transito').value);
        state.config[ref]={leadTime:isNaN(lt)?DEFAULT_LEAD_TIME:lt,safety:isNaN(sf)?DEFAULT_SAFETY:sf,transito:isNaN(tr_)?0:tr_};
        saveState(); renderStats();
      }
      tr.querySelectorAll('input').forEach(function(inp){inp.addEventListener('change',function(){commit();toast('Configuración actualizada.');});});
    });
  }

  // ── Init ──────────────────────────────────────
  async function init(){
    var dl=document.getElementById('productList');
    dl.innerHTML=PRODUCTS_RAW.map(function(p){return'<option value="'+escapeHtml(p.ref+' — '+p.nombre)+'"></option>';}).join('');

    await loadState();

    document.getElementById('settings-btn').addEventListener('click',abrirAjustesConexion);

    try{
      var saved=await window.storage.get(STORE_URL_KEY,false);
      var urlAUsar=(saved&&saved.value)?saved.value:DEFAULT_SHEETS_URL;
      await conectarSheets(urlAUsar,true);
    }catch(e){ await conectarSheets(DEFAULT_SHEETS_URL,true); }

    renderStats();
    renderInicioView();
  }

  // ══════════════════════════════════════════════
  //  MOBILE — bottom nav + card renderers
  // ══════════════════════════════════════════════

  var isMobile = function(){ return window.innerWidth <= 640; };

  // Keep bottom nav in sync with switchTab
  var _origSwitchTab = switchTab;
  switchTab = function(tab){
    _origSwitchTab(tab);
    // Sync bottom nav highlight
    document.querySelectorAll('.bnav-item').forEach(function(it){
      it.classList.toggle('active', it.getAttribute('data-tab') === tab);
    });
    // Scroll bottom nav item into view
    var active = document.querySelector('.bnav-item.active');
    if (active) active.scrollIntoView({inline:'center', behavior:'smooth', block:'nearest'});
    // On mobile: re-render card-based views
    if (isMobile()){
      if (tab === 'alertas') renderAlertasViewMobile();
      if (tab === 'panel')   renderPanelViewMobile();
    }
  };

  // Wire bottom nav clicks
  document.getElementById('bottom-nav').addEventListener('click', function(e){
    var item = e.target.closest('.bnav-item');
    if (item) switchTab(item.getAttribute('data-tab'));
  });

  // ── Mobile: Alertas as cards ──────────────────
  function renderAlertasViewMobile(){
    var el = document.getElementById('view-alertas');
    var all = computeAll().filter(function(r){ return r.alerta === 'PEDIR YA'; })
                          .sort(function(a,b){ return a.diasCobertura - b.diasCobertura; });
    var vencidos = all.filter(function(r){ return r.vencido; });

    var kpiStrip =
      '<div class="m-kpi-strip">'+
        '<div class="m-kpi-pill red" data-kpi-filter="PEDIR YA">'+
          '<div class="mpn">'+all.length+'</div><div class="mpl">Pedir ya</div>'+
        '</div>'+
        '<div class="m-kpi-pill" style="border-color:var(--red);">'+
          '<div class="mpn" style="color:var(--red);">'+vencidos.length+'</div><div class="mpl">Vencidos</div>'+
        '</div>'+
        '<div class="m-kpi-pill amber">'+
          '<div class="mpn">'+all.reduce(function(a,r){return a+r.cantidadSugerida;},0).toLocaleString('es-CO')+'</div><div class="mpl">Unidades</div>'+
        '</div>'+
      '</div>';

    var pedidoBtn = connected
      ? '<button class="btn btn-primary" id="m-btn-pedidos" style="width:100%;margin-bottom:14px;">📦 Generar y enviar pedidos</button>'
      : '';

    var cards = all.map(function(r){
      var bc = r.alerta==='PEDIR YA'?'pedir':'sindato';
      var vStyle = r.vencido ? 'red' : '';
      var lt = r.vencido ? '⚠️ VENCIDO' : fmtDate(r.fechaLimitePedido);
      return '<div class="m-card" data-ref="'+escapeHtml(r.ref)+'">'+
        '<div class="m-card-header">'+
          '<div>'+
            '<div class="m-card-ref">'+escapeHtml(r.ref)+' · '+escapeHtml(r.canal)+'</div>'+
            '<div class="m-card-title">'+escapeHtml(r.nombre)+'</div>'+
          '</div>'+
          '<span class="badge '+bc+'" style="flex-shrink:0;">'+r.alerta+'</span>'+
        '</div>'+
        '<div class="m-card-body">'+
          '<div class="m-kv"><div class="mk">Stock</div><div class="mv">'+Math.round(r.stockActual)+'</div></div>'+
          '<div class="m-kv"><div class="mk">Cobertura</div><div class="mv '+(r.diasCobertura<30?'red':r.diasCobertura<60?'amber':'')+'">'+r.diasCobertura.toFixed(0)+' d</div></div>'+
          '<div class="m-kv"><div class="mk">A pedir</div><div class="mv amber">'+r.cantidadSugerida.toLocaleString('es-CO')+'</div></div>'+
        '</div>'+
        '<div class="m-card-footer">'+
          '<span style="font-size:11px;color:var(--muted);">Agotado: <strong>'+fmtDate(r.fechaAgotado)+'</strong></span>'+
          '<span style="font-size:11px;font-weight:700;color:'+(r.vencido?'var(--red)':'var(--ink)')+';">Pedir antes: '+lt+'</span>'+
        '</div>'+
      '</div>';
    }).join('');

    if (!all.length){
      cards = '<div class="m-empty"><div class="m-empty-icon">✅</div><p>No hay productos en estado crítico ahora mismo.</p></div>';
    }

    el.innerHTML =
      '<div style="padding:4px 0 8px;">'+
        '<div class="m-section-header">'+
          '<h2>🚨 Alertas</h2>'+
          '<span class="m-count">'+all.length+' productos</span>'+
        '</div>'+
        kpiStrip+
        pedidoBtn+
        cards+
      '</div>';

    // Wire kpi pills
    document.querySelectorAll('#view-alertas [data-kpi-filter]').forEach(function(pill){
      pill.addEventListener('click', function(){
        alertFilter = pill.getAttribute('data-kpi-filter');
        switchTab('panel');
      });
    });

    // Wire cards
    document.querySelectorAll('#view-alertas .m-card[data-ref]').forEach(function(card){
      card.addEventListener('click', function(){ abrirDetalleProducto(card.getAttribute('data-ref')); });
    });

    // Wire pedidos button
    var mBtnPed = document.getElementById('m-btn-pedidos');
    if (mBtnPed){
      mBtnPed.addEventListener('click', async function(){
        if (!confirm('¿Enviar correos de pedido a proveedores?')) return;
        mBtnPed.disabled = true; mBtnPed.textContent = 'Enviando…';
        try{
          var res = await fetch(sheetsUrl, {method:'POST', body:JSON.stringify({action:'generarPedidos'})});
          var json = await res.json();
          if (!json.ok) throw new Error(json.error||'error');
          serverProductos = json.productos.map(mapServerProduct);
          var r2 = json.resumenPedidos||{};
          toast((r2.correosEnviados||0)+' correo(s) enviado(s) — '+(r2.referencias||0)+' referencias.');
          renderStats(); renderAlertasViewMobile();
        }catch(e){ toast('Error al enviar pedidos.'); mBtnPed.disabled=false; mBtnPed.textContent='📦 Generar y enviar pedidos'; }
      });
    }
  }

  // ── Mobile: Panel de productos as cards ───────
  function renderPanelViewMobile(){
    var el = document.getElementById('view-panel');
    var all = computeAll();

    // Filter chips
    var chips = [
      {label:'Todos', val:'', cls:''},
      {label:'🔴 Pedir ya', val:'PEDIR YA', cls:'chip-red'},
      {label:'✅ OK', val:'OK', cls:'chip-green'},
      {label:'⏰ Vencidos', val:'VENCIDO', cls:''},
      {label:'❔ Sin dato', val:'SIN DATO', cls:''}
    ];

    var chipHtml = chips.map(function(c){
      var isActive = alertFilter === c.val ? ' active' : (c.val===''&&!alertFilter?' active':'');
      return '<div class="m-chip '+c.cls+isActive+'" data-filter="'+escapeHtml(c.val)+'">'+c.label+'</div>';
    }).join('');

    el.innerHTML =
      '<div style="padding:4px 0 8px;">'+
        '<div class="m-section-header">'+
          '<h2>📦 Productos</h2>'+
          '<span class="m-count" id="m-panel-count"></span>'+
        '</div>'+
        '<div class="m-search"><input type="text" id="m-pf-search" placeholder="Buscar referencia o nombre…" value="'+escapeHtml(searchTerm)+'"></div>'+
        '<div class="m-chips" id="m-chips">'+chipHtml+'</div>'+
        '<div id="m-panel-cards"></div>'+
      '</div>';

    function renderMobileCards(){
      var list = computeAll();
      var q = document.getElementById('m-pf-search');
      var s = q ? q.value.toLowerCase() : searchTerm;
      if (s) list = list.filter(function(r){ return r.ref.toLowerCase().indexOf(s)>=0 || r.nombre.toLowerCase().indexOf(s)>=0; });
      if (alertFilter === 'VENCIDO') list = list.filter(function(r){ return r.vencido; });
      else if (alertFilter) list = list.filter(function(r){ return r.alerta === alertFilter; });
      list.sort(function(a,b){ return a.diasCobertura - b.diasCobertura; });

      var countEl = document.getElementById('m-panel-count');
      if (countEl) countEl.textContent = list.length+' / '+PRODUCTS_RAW.length;

      var MAX_CARDS = 60; // cap for performance
      var html = list.slice(0, MAX_CARDS).map(function(r){
        var bc = r.alerta==='PEDIR YA'?'pedir':(r.alerta==='OK'?'ok':'sindato');
        var covColor = r.diasCobertura < 30 ? 'red' : r.diasCobertura < 90 ? 'amber' : 'green';
        return '<div class="m-card" data-ref="'+escapeHtml(r.ref)+'">'+
          '<div class="m-card-header">'+
            '<div style="min-width:0;">'+
              '<div class="m-card-ref">'+escapeHtml(r.ref)+' · '+escapeHtml(r.canal)+'</div>'+
              '<div class="m-card-title" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">'+escapeHtml(r.nombre)+'</div>'+
            '</div>'+
            '<span class="badge '+bc+'" style="flex-shrink:0;font-size:10px;">'+r.alerta+'</span>'+
          '</div>'+
          '<div class="m-card-body">'+
            '<div class="m-kv"><div class="mk">Stock</div><div class="mv">'+Math.round(r.stockActual).toLocaleString('es-CO')+'</div></div>'+
            '<div class="m-kv"><div class="mk">Cobertura</div><div class="mv '+covColor+'">'+r.diasCobertura.toFixed(0)+' d</div></div>'+
            '<div class="m-kv"><div class="mk">Pedir</div><div class="mv '+(r.cantidadSugerida>0?'amber':'')+'">'+r.cantidadSugerida.toLocaleString('es-CO')+'</div></div>'+
          '</div>'+
        '</div>';
      }).join('');

      if (!list.length) html = '<div class="m-empty"><div class="m-empty-icon">🔍</div><p>Sin resultados para este filtro.</p></div>';
      else if (list.length > MAX_CARDS) html += '<p class="hint" style="text-align:center;padding:10px;">Mostrando primeros '+MAX_CARDS+' de '+list.length+'. Usa el buscador para filtrar.</p>';

      var box = document.getElementById('m-panel-cards');
      if (box) box.innerHTML = html;

      document.querySelectorAll('#m-panel-cards .m-card[data-ref]').forEach(function(card){
        card.addEventListener('click', function(){ abrirDetalleProducto(card.getAttribute('data-ref')); });
      });
    }

    // Wire search
    document.getElementById('m-pf-search').addEventListener('input', function(e){
      searchTerm = e.target.value;
      renderMobileCards();
    });

    // Wire chips
    document.querySelectorAll('#m-chips .m-chip').forEach(function(chip){
      chip.addEventListener('click', function(){
        alertFilter = chip.getAttribute('data-filter');
        document.querySelectorAll('#m-chips .m-chip').forEach(function(c){ c.classList.toggle('active', c.getAttribute('data-filter')===alertFilter); });
        renderMobileCards();
      });
    });

    renderMobileCards();
  }

  // ── Mobile: override renderAlertasView ────────
  // Intercept renderAlertasView to use mobile card version when on mobile
  var _origRenderAlertasView = renderAlertasView;
  renderAlertasView = function(){
    if (isMobile()) renderAlertasViewMobile();
    else _origRenderAlertasView();
  };

  // Intercept renderPanelView to use mobile card version when on mobile
  var _origRenderPanelView = renderPanelView;
  renderPanelView = function(){
    if (isMobile()) renderPanelViewMobile();
    else _origRenderPanelView();
  };

  // Re-render on resize crossing the 640px boundary
  var _lastWasMobile = isMobile();
  window.addEventListener('resize', function(){
    var nowMobile = isMobile();
    if (nowMobile !== _lastWasMobile){
      _lastWasMobile = nowMobile;
      switchTab(currentTab);
    }
  });

  // Expose switchTab globally (used in onclick attributes in renderInicioView)
  window.switchTab = switchTab;

  init();
})();
</script>
