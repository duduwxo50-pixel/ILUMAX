<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Panel de Reabastecimiento</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script>
  // Respaldo: si un bloqueador (p. ej. Brave Shields, adblock) impide el CDN principal,
  // intentamos una segunda fuente antes de que el dashboard intente usar Chart.js.
  window.addEventListener('DOMContentLoaded', function(){
    if (typeof Chart === 'undefined') {
      var s = document.createElement('script');
      s.src = 'https://unpkg.com/chart.js@4.4.4/dist/chart.umd.min.js';
      document.head.appendChild(s);
    }
  });
</script>
<style>
  :root{
    --navy: #14213D;
    --navy-2: #1E2E52;
    --paper: #F4F5F7;
    --panel: #FFFFFF;
    --ink: #1F2430;
    --muted: #737C8C;
    --line: #E3E5EA;
    --amber: #E8871E;
    --amber-soft: #FCEBD4;
    --green: #2F9E5B;
    --green-soft: #E1F3E7;
    --red: #D64550;
    --red-soft: #FBE3E5;
    --gray-soft: #ECEDF0;
    --mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--paper);color:var(--ink);font-family:var(--sans);}
  body{min-height:100vh;}
  .app{max-width:1280px;margin:0 auto;padding:20px 24px 60px;}

  /* Top bar */
  .topbar{
    display:flex;align-items:center;justify-content:space-between;
    background:linear-gradient(135deg, var(--navy) 0%, var(--navy-2) 100%);
    color:#fff;border-radius:14px;padding:20px 26px;margin-bottom:20px;
    box-shadow:0 8px 24px -12px rgba(20,33,61,0.5);
  }
  .brand{display:flex;align-items:center;gap:12px;}
  .brand .dot{
    width:10px;height:10px;border-radius:50%;background:var(--green);
    box-shadow:0 0 0 0 rgba(47,158,91,.6);
    animation:pulse 2s infinite;
  }
  @keyframes pulse{
    0%{box-shadow:0 0 0 0 rgba(47,158,91,.55);}
    70%{box-shadow:0 0 0 8px rgba(47,158,91,0);}
    100%{box-shadow:0 0 0 0 rgba(47,158,91,0);}
  }
  .brand h1{font-size:15px;letter-spacing:.14em;text-transform:uppercase;margin:0;font-weight:700;}
  .brand .sub{font-size:12px;color:#B9C2DA;letter-spacing:.02em;margin-top:2px;}
  .brand-text{display:flex;flex-direction:column;}
  .stats{display:flex;gap:10px;flex-wrap:wrap;}
  .stat{
    background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);
    border-radius:10px;padding:8px 14px;text-align:center;min-width:78px;
  }
  .stat .num{font-family:var(--mono);font-size:20px;font-weight:700;line-height:1;}
  .stat .lbl{font-size:10px;color:#B9C2DA;text-transform:uppercase;letter-spacing:.08em;margin-top:4px;}
  .stat.red .num{color:#FF9AA2;}
  .stat.green .num{color:#8FE3AE;}
  .stat.gray .num{color:#C9CFDD;}

  /* Tabs */
  .tabs{display:flex;gap:6px;margin-bottom:18px;border-bottom:1px solid var(--line);}
  .tab{
    padding:10px 18px;font-size:13px;font-weight:600;color:var(--muted);
    cursor:pointer;border-bottom:2px solid transparent;user-select:none;
    letter-spacing:.01em;
  }
  .tab:hover{color:var(--ink);}
  .tab.active{color:var(--navy);border-bottom-color:var(--amber);}

  .panel{
    background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:22px;margin-bottom:16px;
  }
  .panel h2{font-size:15px;margin:0 0 4px;color:var(--ink);}
  .panel .desc{font-size:12.5px;color:var(--muted);margin:0 0 18px;}

  /* Forms */
  label{display:block;font-size:11.5px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px;}
  input, select{
    width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;
    font-size:13.5px;color:var(--ink);background:#fff;font-family:var(--sans);
  }
  input:focus, select:focus{outline:none;border-color:var(--navy);box-shadow:0 0 0 3px rgba(20,33,61,.08);}
  .field{margin-bottom:14px;}
  .row{display:grid;gap:14px;}
  .row.cols-4{grid-template-columns:2fr 1fr 1fr 1fr;}
  .row.cols-3{grid-template-columns:2fr 1fr 1fr;}
  .btn{
    appearance:none;border:none;border-radius:8px;padding:10px 18px;font-size:13.5px;font-weight:700;
    cursor:pointer;font-family:var(--sans);letter-spacing:.01em;
  }
  .btn-primary{background:var(--navy);color:#fff;}
  .btn-primary:hover{background:var(--navy-2);}
  .btn-ghost{background:var(--gray-soft);color:var(--ink);}
  .btn-ghost:hover{background:#E1E3E8;}
  .btn-danger-outline{background:#fff;color:var(--red);border:1px solid var(--red-soft);padding:5px 10px;font-size:12px;}
  .btn-danger-outline:hover{background:var(--red-soft);}

  /* Table */
  table{width:100%;border-collapse:collapse;font-size:12.8px;}
  th{
    text-align:left;padding:9px 10px;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;
    color:var(--muted);border-bottom:2px solid var(--line);cursor:pointer;white-space:nowrap;position:sticky;top:0;background:var(--panel);
  }
  th:hover{color:var(--ink);}
  td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle;}
  tr:hover td{background:#FAFBFC;}
  .num-cell{font-family:var(--mono);text-align:right;font-variant-numeric:tabular-nums;}
  .table-scroll{max-height:560px;overflow:auto;border:1px solid var(--line);border-radius:10px;}

  .badge{
    display:inline-block;padding:3px 10px;border-radius:100px;font-size:11px;font-weight:700;
    letter-spacing:.02em;white-space:nowrap;
  }
  .badge.pedir{background:var(--red-soft);color:var(--red);}
  .badge.ok{background:var(--green-soft);color:var(--green);}
  .badge.sindato{background:var(--gray-soft);color:var(--muted);}

  .toolbar{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap;align-items:center;}
  .toolbar input[type=text]{max-width:280px;}
  .toolbar select{max-width:180px;}
  .toolbar .spacer{flex:1;}
  .hint{font-size:11.5px;color:var(--muted);}

  .empty{
    padding:40px 20px;text-align:center;color:var(--muted);font-size:13px;
  }

  .legend-row{display:flex;gap:16px;margin-top:10px;flex-wrap:wrap;}
  .legend-item{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted);}
  .legend-dot{width:9px;height:9px;border-radius:3px;}

  .toast{
    position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
    background:var(--navy);color:#fff;padding:11px 20px;border-radius:8px;font-size:13px;
    box-shadow:0 8px 24px -8px rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:opacity .25s, transform .25s;
    z-index:50;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-6px);}

  ::-webkit-scrollbar{width:10px;height:10px;}
  ::-webkit-scrollbar-thumb{background:#D3D6DD;border-radius:6px;}
  ::-webkit-scrollbar-track{background:transparent;}

  @media (max-width: 720px){
    .topbar{flex-direction:column;align-items:flex-start;gap:14px;}
    .row.cols-4, .row.cols-3{grid-template-columns:1fr;}
  }

  .modal-overlay{
    display:none;position:fixed;inset:0;background:rgba(20,33,61,.45);
    align-items:flex-start;justify-content:center;padding:40px 16px;z-index:100;overflow-y:auto;
  }
  .modal-overlay.show{display:flex;}
  .modal-box{
    background:#fff;border-radius:14px;max-width:720px;width:100%;padding:24px;
    box-shadow:0 24px 60px -12px rgba(0,0,0,.35);
  }
  .modal-close{
    float:right;background:var(--gray-soft);border:none;border-radius:8px;padding:6px 12px;
    cursor:pointer;font-size:13px;font-weight:700;color:var(--ink);
  }
  .modal-close:hover{background:#E1E3E8;}
  .row-click{cursor:pointer;}
  .row-click:hover td{background:#EEF1FA !important;}
  .sparkbar-wrap{display:flex;align-items:flex-end;gap:3px;height:60px;margin:10px 0;}
  .sparkbar{flex:1;background:var(--navy);border-radius:2px 2px 0 0;min-height:2px;}
  .kv-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 20px;margin-bottom:16px;}
  .kv-item .k{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);}
  .kv-item .v{font-size:15px;font-weight:700;color:var(--ink);font-family:var(--mono);}

  /* Dashboard charts */
  .chart-grid{display:grid;grid-template-columns:1.1fr 1.4fr;gap:20px;margin-top:22px;}
  .chart-grid.full{grid-template-columns:1fr;}
  .chart-card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px 20px;}
  .chart-card h3{font-size:13px;margin:0 0 2px;color:var(--ink);display:flex;align-items:center;gap:8px;}
  .chart-card .chart-desc{font-size:11.5px;color:var(--muted);margin:0 0 14px;}
  .chart-canvas-wrap{position:relative;width:100%;}
  .kpi-icon{display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:10px;font-size:17px;margin-bottom:8px;}
  .stat2{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px;min-width:0;transition:transform .15s, box-shadow .15s;}
  .stat2:hover{transform:translateY(-2px);box-shadow:0 10px 20px -12px rgba(20,33,61,.25);}
  .stat2.click-kpi{cursor:pointer;}
  .stat2 .num{font-family:var(--mono);font-size:24px;font-weight:800;line-height:1;color:var(--ink);}
  .stat2 .lbl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-top:6px;}
  .kpis-row{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-top:4px;}
  @media (max-width: 980px){ .chart-grid{grid-template-columns:1fr;} .kpis-row{grid-template-columns:repeat(2,1fr);} }
  .center-label{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;pointer-events:none;}
  .center-label .big{font-family:var(--mono);font-size:26px;font-weight:800;color:var(--ink);line-height:1;}
  .center-label .small{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-top:4px;}
</style>
</head>

<div class="app">

  <div class="topbar">
    <div class="brand">
      <span class="dot"></span>
      <div class="brand-text">

  <div id="view-dashboard"></div>
  <div id="view-registrar" style="display:none;"></div>
  <div id="view-panel" style="display:none;"></div>

  <div id="view-proyeccion" style="display:none;"></div>
  <div id="view-proveedores" style="display:none;"></div>
  <div id="view-config" style="display:none;"></div>

</div>

<div class="modal-overlay" id="modal-overlay">

    toast._h = setTimeout(function(){ t.classList.remove('show'); }, 2200);
  }

  function fmtDate(d){
    if(!d) return '—';
    var dd = String(d.getDate()).padStart(2,'0');
    var mm = String(d.getMonth()+1).padStart(2,'0');
    var yy = d.getFullYear();
    return dd+'/'+mm+'/'+yy;
  }

  function todayISO(){
    var d = new Date();
    var mm = String(d.getMonth()+1).padStart(2,'0');
    var dd = String(d.getDate()).padStart(2,'0');
    return d.getFullYear()+'-'+mm+'-'+dd;
  }

  function daysBetween(a,b){
    return (b - a) / (1000*60*60*24);
  }

  // ---------- Storage ----------
  async function loadState(){
    try{
      var res = await window.storage.get(STORE_KEY, false);
      if(res && res.value){
        var parsed = JSON.parse(res.value);
        state.movimientos = parsed.movimientos || [];
        state.config = parsed.config || {};
      }
    }catch(e){
      // key doesn't exist yet — start fresh
      state = { movimientos: [], config: {} };
    }
  }

  var saveTimer = null;
  function saveState(){
    clearTimeout(saveTimer);
    saveTimer = setTimeout(async function(){
      try{
        await window.storage.set(STORE_KEY, JSON.stringify(state), false);
      }catch(e){
        toast('No se pudo guardar. Intenta de nuevo.');
      }
    }, 150);
  }

  // ---------- Computation ----------
  function getConfig(ref){
    var c = state.config[ref] || {};
    return {
      leadTime: (typeof c.leadTime === 'number') ? c.leadTime : DEFAULT_LEAD_TIME,
      safety: (typeof c.safety === 'number') ? c.safety : DEFAULT_SAFETY,
      transito: (typeof c.transito === 'number') ? c.transito : null
    };
  }

  function computeProduct(p){
    var cfg = getConfig(p.ref);
    var transito = cfg.transito !== null ? cfg.transito : p.transito;

    var entradas = 0, salidas = 0;
    var now = new Date();
    var last30Sum = 0, last30Count = 0;

    for(var i=0;i<state.movimientos.length;i++){
      var m = state.movimientos[i];
      if(m.ref !== p.ref) continue;
      var qty = Number(m.cantidad) || 0;
      if(m.tipo === 'entrada'){ entradas += qty; }
      else { salidas += qty;
        var mDate = new Date(m.fecha+'T00:00:00');
        var diff = daysBetween(mDate, now);
        if(diff >= 0 && diff <= 30){ last30Sum += qty; last30Count++; }
      }
    }

    var stockActual = p.stock0 + entradas - salidas;

    var histVals = p.m.filter(function(v){ return typeof v === 'number'; });
    var histAvgDaily = histVals.length ? (histVals.reduce(function(a,b){return a+b;},0)/histVals.length)/30 : 0;

    var avgDaily = last30Count > 0 ? (last30Sum/30) : histAvgDaily;

    var diasCobertura = avgDaily > 0 ? (stockActual + transito)/avgDaily : 0;
    var fechaAgotado = avgDaily > 0 ? new Date(now.getTime() + diasCobertura*86400000) : null;
    var cantidadSugerida = avgDaily > 0 ? Math.max(0, Math.round(avgDaily*(cfg.leadTime+cfg.safety) - stockActual - transito)) : 0;

    // Fecha límite para colocar el pedido: si no se pide para esa fecha, se agota antes de que llegue el próximo lote
    var diasParaPedir = diasCobertura - cfg.leadTime;
    var fechaLimitePedido = avgDaily > 0 ? new Date(now.getTime() + diasParaPedir*86400000) : null;
    var vencido = avgDaily > 0 && diasParaPedir <= 0;

    var alerta;
    if(avgDaily <= 0) alerta = 'SIN DATO';
    else alerta = (diasCobertura < (cfg.leadTime + cfg.safety)) ? 'PEDIR YA' : 'OK';

    return {
      ref: p.ref, nombre: p.nombre, canal: p.canal,
      stockActual: stockActual, transito: transito,
      avgDaily: avgDaily, diasCobertura: diasCobertura,
      fechaAgotado: fechaAgotado, cantidadSugerida: cantidadSugerida,
      fechaLimitePedido: fechaLimitePedido, vencido: vencido,
      alerta: alerta, leadTime: cfg.leadTime, safety: cfg.safety
    };
  }

  function computeAll(){
    if (connected && serverProductos) return serverProductos;
    return PRODUCTS_RAW.map(computeProduct);
  }

  // ---------- Conexión a Google Sheets ----------
  function mapServerProduct(p){
    return {
      ref: p.ref, nombre: p.nombre, canal: p.canal, proveedor: p.proveedor,
      stockActual: p.stockActual, transito: p.transito,
      avgDaily: p.avgDaily, diasCobertura: p.diasCobertura,
      fechaAgotado: p.fechaAgotado ? new Date(p.fechaAgotado) : null,
      cantidadSugerida: p.cantidadSugerida,
      fechaLimitePedido: p.fechaLimitePedido ? new Date(p.fechaLimitePedido) : null,
      vencido: !!p.vencido, alerta: p.alerta,
      leadTime: p.leadTime, safety: p.safety
    };
  }

  function setConnectionStatus(msg, isConnected){
    lastConnStatus = msg; lastConnConnected = isConnected;
    var statusEl = document.getElementById('sheets-status');
    if (statusEl) statusEl.textContent = msg;
    var syncBtn = document.getElementById('sheets-sync');
    if (syncBtn) syncBtn.style.display = isConnected ? 'inline-block' : 'none';
  }

  function abrirAjustesConexion(){
    var html =
      '<button class="modal-close" id="modal-close-btn">Cerrar ✕</button>'+
      '<h2 style="margin-top:0;color:var(--navy);">Conexión a Google Sheets</h2>'+
      '<div class="field"><label>URL de tu Apps Script publicado (/exec)</label>'+
      '<input type="text" id="sheets-url" value="'+escapeHtml(sheetsUrl||DEFAULT_SHEETS_URL)+'"></div>'+
      '<div style="display:flex;gap:10px;margin:10px 0;">'+
        '<button class="btn btn-primary" id="sheets-connect">Conectar</button>'+
        '<button class="btn btn-ghost" id="sheets-sync" style="display:'+(connected?'inline-block':'none')+';">🔄 Sincronizar ahora</button>'+
      '</div>'+
      '<p class="hint" id="sheets-status">'+escapeHtml(lastConnStatus||'')+'</p>';
    openModal(html);
    document.getElementById('modal-close-btn').addEventListener('click', closeModal);
    document.getElementById('sheets-connect').addEventListener('click', function(){
      conectarSheets(document.getElementById('sheets-url').value.trim(), false);
    });
    document.getElementById('sheets-sync').addEventListener('click', function(){ sincronizarSheets(); });
  }

  async function conectarSheets(url, silencioso){
    if (!url){ toast('Pega la URL de tu Apps Script publicado primero.'); return; }
    setConnectionStatus('Conectando…', false);
    try{
      var sep = url.indexOf('?') >= 0 ? '&' : '?';
      var res = await fetch(url + sep + 'action=data');
      var json = await res.json();
      if (!json.ok) throw new Error(json.error || 'Respuesta inválida');
      serverProductos = json.productos.map(mapServerProduct);
      connected = true;
      sheetsUrl = url;
      try{ await window.storage.set(STORE_URL_KEY, url, false); }catch(e){}
      setConnectionStatus('Conectado a ' + (json.empresa||'Google Sheets') + ' — ' + serverProductos.length + ' productos.', true);
      renderStats();
      switchTab(currentTab);
      if (!silencioso) toast('Conectado a Google Sheets correctamente.');
    }catch(e){
      connected = false; serverProductos = null;
      setConnectionStatus('No se pudo conectar. Revisa que la URL sea la de "Aplicación web" (termina en /exec) y que el acceso esté en "Cualquier persona".', false);
      renderStats();
      if (!silencioso) toast('No se pudo conectar a Google Sheets.');
    }
  }

  async function sincronizarSheets(){
    if (!sheetsUrl) return;
    await conectarSheets(sheetsUrl, true);
    toast('Sincronizado con Google Sheets.');
  }

  async function enviarMovimientoASheets(ref, fecha, tipo, cantidad){
    var res = await fetch(sheetsUrl, {
      method: 'POST',
      body: JSON.stringify({ action:'addMovimiento', ref: ref, fecha: fecha, tipo: (tipo==='entrada'?'Entrada':'Salida'), cantidad: cantidad })
    });
    var json = await res.json();
    if (!json.ok) throw new Error(json.error || 'Error al guardar en Sheets');
    serverProductos = json.productos.map(mapServerProduct);
  }

  // ---------- Modal genérico ----------
  function openModal(html){
    document.getElementById('modal-box').innerHTML = html;
    document.getElementById('modal-overlay').classList.add('show');
  }
  function closeModal(){
    document.getElementById('modal-overlay').classList.remove('show');
  }
  document.getElementById('modal-overlay').addEventListener('click', function(e){
    if (e.target.id === 'modal-overlay') closeModal();
  });

  // ---------- Detalle de producto + histórico ----------
  async function abrirDetalleProducto(ref){
    var nombreLocal = (PRODUCTS_RAW.find(function(p){return p.ref===ref;})||{}).nombre || ref;
    openModal('<div class="empty">Cargando histórico de '+escapeHtml(nombreLocal)+'…</div>');

    if (connected && sheetsUrl){
      try{
        var res = await fetch(sheetsUrl + '?action=historial&ref=' + encodeURIComponent(ref));
        var json = await res.json();
        if (!json.ok) throw new Error(json.error||'error');
        renderDetalleModal(json.producto, json.historial.map(function(h){
          return { fila: h.fila, fecha: h.fecha.slice(0,10), tipo: h.tipo==='Entrada'?'entrada':'salida', cantidad: h.cantidad, notas: h.notas };
        }), true);
      }catch(e){
        openModal('<button class="modal-close" onclick="document.getElementById(\'modal-overlay\').classList.remove(\'show\')">Cerrar</button>'+
          '<div class="empty">No se pudo cargar el histórico desde Google Sheets.</div>');
      }
    } else {
      var p = computeAll().find(function(r){return r.ref===ref;});
      var localMovs = state.movimientos.filter(function(m){return m.ref===ref;})
        .sort(function(a,b){return b.fecha.localeCompare(a.fecha);});
      renderDetalleModal(p, localMovs, false);
    }
  }

  function renderDetalleModal(p, historial, modoConectado){
    if (!p){
      openModal('<button class="modal-close" id="modal-close-btn">Cerrar</button><div class="empty">No encontré datos de este producto.</div>');
      document.getElementById('modal-close-btn').addEventListener('click', closeModal);
      return;
    }

    var badgeClass = p.alerta==='PEDIR YA'?'pedir':(p.alerta==='OK'?'ok':'sindato');

    // Mini gráfico de barras con los últimos consumos (salidas) del histórico
    var salidas = historial.filter(function(h){return h.tipo==='salida';}).slice(0,12).reverse();
    var maxQty = Math.max.apply(null, salidas.map(function(h){return h.cantidad;}).concat([1]));
    var spark = salidas.map(function(h){
      var pct = Math.max(4, (h.cantidad/maxQty)*100);
      return '<div class="sparkbar" style="height:'+pct+'%;" title="'+fmtDate(new Date(h.fecha+'T00:00:00'))+': '+h.cantidad+'"></div>';
    }).join('');

    var histRows = historial.slice(0,40).map(function(h){
      var tipoLabel = h.tipo==='entrada' ? '<span class="badge ok">Entrada</span>' : '<span class="badge sindato">Consumo</span>';
      var delKey = modoConectado ? h.fila : h.id;
      var delBtn = delKey ? '<button class="btn-danger-outline" data-delkey="'+delKey+'">Eliminar</button>' : '';
      return '<tr><td>'+fmtDate(new Date(h.fecha+'T00:00:00'))+'</td><td>'+tipoLabel+'</td><td class="num-cell">'+h.cantidad+'</td><td>'+delBtn+'</td></tr>';
    }).join('');
    if (!historial.length) histRows = '<tr><td colspan="4"><div class="empty">Sin movimientos registrados todavía para este producto.</div></td></tr>';

    // ---- Sustentación: por qué (y cuánto) pedir ----
    var sustentacion;
    if (p.avgDaily > 0){
      var diasNecesarios = (p.leadTime||0) + (p.safety||0);
      var necesarioUnidades = Math.round(p.avgDaily * diasNecesarios);
      var disponible = Math.round(p.stockActual + (p.transito||0));
      sustentacion =
        '<ol style="margin:0;padding-left:18px;font-size:13px;line-height:1.7;color:var(--ink);">'+
          '<li>Consumes en promedio <strong>'+p.avgDaily.toFixed(1)+' unidades/día</strong> (calculado sobre tu historial real de movimientos).</li>'+
          '<li>Tu proveedor'+(p.proveedor?' ('+escapeHtml(p.proveedor)+')':'')+' tarda <strong>'+(p.leadTime||0)+' días</strong> en entregar el pedido.</li>'+
          '<li>Para protegerte de variaciones en la demanda, el sistema sugiere un colchón de seguridad de <strong>'+(p.safety||0)+' días</strong>, calculado según qué tan variable ha sido tu consumo (a más variable, más colchón).</li>'+
          '<li>Entre lead time y colchón, necesitas tener cubiertos <strong>'+diasNecesarios+' días</strong> de consumo ≈ <strong>'+necesarioUnidades.toLocaleString('es-CO')+' unidades</strong>.</li>'+
          '<li>Hoy tienes <strong>'+Math.round(p.stockActual).toLocaleString('es-CO')+'</strong> en stock'+((p.transito||0)>0?' + <strong>'+Math.round(p.transito).toLocaleString('es-CO')+'</strong> en tránsito':'')+' = <strong>'+disponible.toLocaleString('es-CO')+' disponibles</strong>.</li>'+
          '<li><strong>'+necesarioUnidades.toLocaleString('es-CO')+' − '+disponible.toLocaleString('es-CO')+' = '+Math.max(0,p.cantidadSugerida).toLocaleString('es-CO')+' unidades a pedir.</strong></li>'+
        '</ol>';
    } else {
      sustentacion = '<p class="hint">Todavía no hay suficiente historial de consumo para calcular una sustentación confiable. Registra movimientos para que el sistema pueda justificar la cantidad a pedir.</p>';
    }

    var editSection =
      '<div class="row cols-4" style="margin-top:6px;">'+
        '<div class="field"><label>Nombre</label><input id="det-nombre" value="'+escapeHtml(p.nombre)+'"></div>'+
        '<div class="field"><label>Canal</label><input id="det-canal" value="'+escapeHtml(p.canal||'')+'"></div>'+
        '<div class="field"><label>Proveedor</label><input id="det-proveedor" value="'+escapeHtml(p.proveedor||'')+'" placeholder="Nombre exacto del proveedor"></div>'+
        '<div class="field"><label>Corregir stock actual</label><input id="det-stock" type="number" placeholder="'+Math.round(p.stockActual)+'"></div>'+
      '</div>'+
      '<div style="display:flex;gap:10px;margin-top:6px;">'+
        '<button class="btn btn-primary" id="det-guardar">Guardar cambios</button>'+
        '<button class="btn-danger-outline" id="det-eliminar" style="padding:10px 16px;">🗑️ Eliminar producto</button>'+
      '</div>';

    var html =
      '<button class="modal-close" id="modal-close-btn">Cerrar ✕</button>'+
      '<h2 style="margin-top:0;color:var(--navy);">'+escapeHtml(p.nombre)+'</h2>'+
      '<p class="hint" style="margin-top:-6px;">Referencia '+escapeHtml(p.ref)+' · '+escapeHtml(p.canal||'')+'</p>'+
      '<div class="kv-grid">'+
        '<div class="kv-item"><div class="k">Stock actual</div><div class="v">'+Math.round(p.stockActual)+'</div></div>'+
        '<div class="kv-item"><div class="k">Consumo/día</div><div class="v">'+p.avgDaily.toFixed(1)+'</div></div>'+
        '<div class="kv-item"><div class="k">Días de cobertura</div><div class="v">'+(p.avgDaily>0? p.diasCobertura.toFixed(0):'—')+'</div></div>'+
        '<div class="kv-item"><div class="k">Colchón sugerido</div><div class="v">'+(p.safety||'—')+' d</div></div>'+
        '<div class="kv-item"><div class="k">Lead time</div><div class="v">'+(p.leadTime||'—')+' d</div></div>'+
        '<div class="kv-item"><div class="k">Alerta</div><div class="v"><span class="badge '+badgeClass+'">'+p.alerta+'</span></div></div>'+
      '</div>'+
      (salidas.length ? '<p class="hint" style="margin-bottom:4px;">Últimos consumos registrados:</p><div class="sparkbar-wrap">'+spark+'</div>' : '')+
      '<h2 style="font-size:13px;margin-top:18px;">📋 Sustentación — por qué pedir esta cantidad</h2>'+
      sustentacion+
      '<h2 style="font-size:13px;margin-top:18px;">Histórico de movimientos</h2>'+
      '<div class="table-scroll" style="max-height:240px;"><table><thead><tr><th>Fecha</th><th>Tipo</th><th>Cantidad</th><th></th></tr></thead><tbody>'+histRows+'</tbody></table></div>'+
      (modoConectado ?
        '<h2 style="font-size:13px;margin-top:18px;">✏️ Editar / eliminar producto</h2>'+editSection :
        '<p class="hint" style="margin-top:16px;">Conéctate a Google Sheets para poder editar o eliminar este producto.</p>');

    openModal(html);
    document.getElementById('modal-close-btn').addEventListener('click', closeModal);

    document.querySelectorAll('#modal-box [data-delkey]').forEach(function(btn){
      btn.addEventListener('click', async function(){
        if (!confirm('¿Eliminar este movimiento del historial?')) return;
        if (modoConectado){
          try{
            var res = await fetch(sheetsUrl, { method:'POST', body: JSON.stringify({ action:'deleteMovimiento', fila: btn.getAttribute('data-delkey') }) });
            var json = await res.json();
            if (!json.ok) throw new Error(json.error||'error');
            serverProductos = json.productos.map(mapServerProduct);
            toast('Movimiento eliminado.');
            abrirDetalleProducto(p.ref);
            renderStats();
          }catch(e){ toast('No se pudo eliminar el movimiento.'); }
        } else {
          state.movimientos = state.movimientos.filter(function(m){ return m.id !== btn.getAttribute('data-delkey'); });
          saveState();
          toast('Movimiento eliminado.');
          abrirDetalleProducto(p.ref);
          renderStats();
        }
      });
    });

    if (modoConectado){
      document.getElementById('det-guardar').addEventListener('click', async function(){
        var btn = document.getElementById('det-guardar');
        btn.disabled = true; btn.textContent = 'Guardando…';
        try{
          var body = {
            action: 'updateProducto', ref: p.ref,
            nombre: document.getElementById('det-nombre').value.trim(),
            canal: document.getElementById('det-canal').value.trim(),
            proveedor: document.getElementById('det-proveedor').value.trim(),
            stockCorregido: document.getElementById('det-stock').value.trim()
          };
          var res = await fetch(sheetsUrl, { method:'POST', body: JSON.stringify(body) });
          var json = await res.json();
          if (!json.ok) throw new Error(json.error||'error');
          serverProductos = json.productos.map(mapServerProduct);
          toast('Producto actualizado.');
          renderStats();
          abrirDetalleProducto(p.ref);
        }catch(e){
          toast('No se pudo guardar el producto.');
          btn.disabled = false; btn.textContent = 'Guardar cambios';
        }
      });

      document.getElementById('det-eliminar').addEventListener('click', async function(){
        if (!confirm('¿Eliminar "'+p.nombre+'" por completo del sistema? Esta acción no se puede deshacer.')) return;
        try{
          var res2 = await fetch(sheetsUrl, { method:'POST', body: JSON.stringify({ action:'deleteProducto', ref: p.ref }) });
          var json2 = await res2.json();
          if (!json2.ok) throw new Error(json2.error||'error');
          serverProductos = json2.productos.map(mapServerProduct);
          toast('Producto eliminado.');
          renderStats();
          closeModal();
          switchTab(currentTab);
        }catch(e){ toast('No se pudo eliminar el producto.'); }
      });
    }
  }


  // ---------- Render: top stats ----------
  function renderStats(){
    var all = computeAll();
    var pedir = all.filter(function(r){return r.alerta==='PEDIR YA';}).length;
    var ok = all.filter(function(r){return r.alerta==='OK';}).length;
    var sindato = all.filter(function(r){return r.alerta==='SIN DATO';}).length;

    var conexionTxt = connected ? '🟢 Conectado a Sheets' : '🔴 Modo local';
    document.getElementById('subLine').textContent = conexionTxt + ' · ' + all.length + ' productos' + (connected ? '' : ' · ' + state.movimientos.length + ' movimientos');

    var el = document.getElementById('statsRow');
    el.innerHTML =
      '<div class="stat red click-kpi" data-filter="PEDIR YA"><div class="num">'+pedir+'</div><div class="lbl">Pedir ya</div></div>'+
      '<div class="stat green click-kpi" data-filter="OK"><div class="num">'+ok+'</div><div class="lbl">OK</div></div>'+
      '<div class="stat gray click-kpi" data-filter="SIN DATO"><div class="num">'+sindato+'</div><div class="lbl">Sin dato</div></div>';

    document.querySelectorAll('#statsRow .click-kpi').forEach(function(card){
      card.style.cursor = 'pointer';
      card.addEventListener('click', function(){
        alertFilter = card.getAttribute('data-filter');
        switchTab('panel');
      });
    });
  }

  // ---------- Tabs ----------
  function switchTab(tab){
    currentTab = tab;
    document.querySelectorAll('.tab').forEach(function(t){
      t.classList.toggle('active', t.getAttribute('data-tab')===tab);
    });
    ['dashboard','registrar','panel','alertas','proyeccion','proveedores','config'].forEach(function(v){
      document.getElementById('view-'+v).style.display = (v===tab)?'block':'none';
    });
    if(tab==='dashboard') renderDashboardView();
    if(tab==='registrar') renderRegistrarView();
    if(tab==='panel') renderPanelView();
    if(tab==='alertas') renderAlertasView();
    if(tab==='proyeccion') renderProyeccionView();
    if(tab==='proveedores') renderProveedoresView();
    if(tab==='config') renderConfigView();
  }

  document.getElementById('tabs').addEventListener('click', function(e){
    var t = e.target.closest('.tab');
    if(t) switchTab(t.getAttribute('data-tab'));
  });

  // ---------- View: Registrar movimiento ----------
  function renderRegistrarView(){
    var el = document.getElementById('view-registrar');
    el.innerHTML =
      '<div class="panel">'+
        '<h2>Registrar movimiento de inventario</h2>'+
        '<p class="desc">Registra cada consumo o entrada de mercancía del día. El panel de productos se recalcula solo — nada de promedios manuales.</p>'+
        '<div class="row cols-4">'+
          '<div class="field"><label>Producto</label><input id="mv-ref" list="productList" placeholder="Escribe referencia o nombre…" autocomplete="off"></div>'+
          '<div class="field"><label>Fecha</label><input id="mv-fecha" type="date"></div>'+
          '<div class="field"><label>Tipo</label><select id="mv-tipo"><option value="salida">Consumo (salida)</option><option value="entrada">Entrada / recepción</option></select></div>'+
          '<div class="field"><label>Cantidad</label><input id="mv-cantidad" type="number" min="0" step="1" placeholder="0"></div>'+
        '</div>'+
        '<button class="btn btn-primary" id="mv-save">Guardar movimiento</button>'+
        '<div class="legend-row">'+
          '<span class="hint">El stock y el consumo promedio se actualizan automáticamente al guardar.</span>'+
        '</div>'+
      '</div>'+
      '<div class="panel">'+
        '<h2>Últimos movimientos</h2>'+
        '<p class="desc">Los 25 más recientes.</p>'+
        '<div id="mv-list"></div>'+
      '</div>';

    document.getElementById('mv-fecha').value = todayISO();

    document.getElementById('mv-save').addEventListener('click', async function(){
      var refInput = document.getElementById('mv-ref').value.trim();
      var fecha = document.getElementById('mv-fecha').value;
      var tipo = document.getElementById('mv-tipo').value;
      var cantidad = parseFloat(document.getElementById('mv-cantidad').value);

      var product = matchProduct(refInput);
      if(!product){ toast('No encontré ese producto. Selecciona uno de la lista.'); return; }
      if(!fecha){ toast('Selecciona una fecha.'); return; }
      if(!cantidad || cantidad <= 0){ toast('Ingresa una cantidad válida.'); return; }

      var saveBtn = document.getElementById('mv-save');

      if (connected){
        saveBtn.disabled = true; saveBtn.textContent = 'Guardando en Sheets…';
        try{
          await enviarMovimientoASheets(product.ref, fecha, tipo, cantidad);
          sessionLog.unshift({ ref: product.ref, nombre: product.nombre, fecha: fecha, tipo: tipo, cantidad: cantidad });
          renderStats();
          renderMovList();
          toast('Guardado en Google Sheets: ' + (tipo==='entrada'?'entrada':'consumo') + ' de ' + cantidad + ' — ' + product.nombre);
        }catch(e){
          toast('No se pudo guardar en Sheets. Verifica la conexión.');
        }
        saveBtn.disabled = false; saveBtn.textContent = 'Guardar movimiento';
      } else {
        state.movimientos.push({
          id: 'm'+Date.now()+Math.random().toString(36).slice(2,7),
          ref: product.ref, fecha: fecha, tipo: tipo, cantidad: cantidad
        });
        saveState();
        renderStats();
        renderMovList();
        toast('Movimiento guardado: ' + (tipo==='entrada'?'entrada':'consumo') + ' de ' + cantidad + ' — ' + product.nombre);
      }

      document.getElementById('mv-cantidad').value = '';
      document.getElementById('mv-ref').value = '';
    });

    renderMovList();
  }

  function matchProduct(input){
    if(!input) return null;
    var exact = PRODUCTS_RAW.find(function(p){ return p.ref === input; });
    if(exact) return exact;
    var lower = input.toLowerCase();
    return PRODUCTS_RAW.find(function(p){
      return (p.ref + ' — ' + p.nombre).toLowerCase() === lower;
    }) || PRODUCTS_RAW.find(function(p){
      return p.nombre.toLowerCase() === lower;
    });
  }

  function renderMovList(){
    if (connected){
      if (!sessionLog.length){
        document.getElementById('mv-list').innerHTML = '<div class="empty">Aún no registras movimientos en esta sesión. El historial completo vive en la hoja "Movimientos" de tu Google Sheet.</div>';
        return;
      }
      var rowsConn = sessionLog.slice(0,25).map(function(m){
        var tipoLabel = m.tipo==='entrada' ? '<span class="badge ok">Entrada</span>' : '<span class="badge sindato">Consumo</span>';
        return '<tr>'+
          '<td>'+fmtDate(new Date(m.fecha+'T00:00:00'))+'</td>'+
          '<td>'+escapeHtml(m.nombre)+'</td>'+
          '<td>'+tipoLabel+'</td>'+
          '<td class="num-cell">'+m.cantidad+'</td>'+
          '</tr>';
      }).join('');
      document.getElementById('mv-list').innerHTML =
        '<p class="hint" style="margin-bottom:8px;">Enviados a Google Sheets en esta sesión (el historial completo está en la hoja "Movimientos"):</p>'+
        '<div class="table-scroll"><table><thead><tr><th>Fecha</th><th>Producto</th><th>Tipo</th><th>Cantidad</th></tr></thead><tbody>'+rowsConn+'</tbody></table></div>';
      return;
    }

    var list = state.movimientos.slice().sort(function(a,b){
      return (b.fecha+b.id).localeCompare(a.fecha+a.id);
    }).slice(0,25);

    if(!list.length){
      document.getElementById('mv-list').innerHTML = '<div class="empty">Todavía no hay movimientos registrados. Agrega el primero arriba.</div>';
      return;
    }

    var byRef = {};
    PRODUCTS_RAW.forEach(function(p){ byRef[p.ref]=p; });

    var rows = list.map(function(m){
      var p = byRef[m.ref];
      var tipoLabel = m.tipo==='entrada' ? '<span class="badge ok">Entrada</span>' : '<span class="badge sindato">Consumo</span>';
      return '<tr>'+
        '<td>'+fmtDate(new Date(m.fecha+'T00:00:00'))+'</td>'+
        '<td>'+ (p? escapeHtml(p.nombre) : m.ref) +'</td>'+
        '<td>'+tipoLabel+'</td>'+
        '<td class="num-cell">'+m.cantidad+'</td>'+
        '<td><button class="btn-danger-outline" data-id="'+m.id+'">Eliminar</button></td>'+
        '</tr>';
    }).join('');

    document.getElementById('mv-list').innerHTML =
      '<div class="table-scroll"><table><thead><tr>'+
      '<th>Fecha</th><th>Producto</th><th>Tipo</th><th>Cantidad</th><th></th>'+
      '</tr></thead><tbody>'+rows+'</tbody></table></div>';

    document.querySelectorAll('#mv-list [data-id]').forEach(function(btn){
      btn.addEventListener('click', function(){
        var id = btn.getAttribute('data-id');
        state.movimientos = state.movimientos.filter(function(m){ return m.id !== id; });
        saveState();
        renderStats();
        renderMovList();
        toast('Movimiento eliminado.');
      });
    });
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c];
    });
  }

  // ---------- View: Panel de productos ----------
  function renderPanelView(){
    var el = document.getElementById('view-panel');
    el.innerHTML =
      '<div class="panel">'+
        '<h2>Panel de productos</h2>'+
        '<p class="desc">Estado de reabastecimiento de las 200 referencias, calculado en tiempo real.</p>'+
        '<div class="toolbar">'+
          '<input type="text" id="pf-search" placeholder="Buscar por referencia o nombre…">'+
          '<select id="pf-alerta"><option value="">Todas las alertas</option><option value="PEDIR YA">Pedir ya</option><option value="VENCIDO">Plazo vencido</option><option value="OK">OK</option><option value="SIN DATO">Sin dato</option></select>'+

          '<span class="hint" id="pf-count"></span>'+

        '<div class="table-scroll" id="pf-table"></div>'+

          '<div class="legend-item"><span class="legend-dot" style="background:var(--green)"></span>OK: cobertura suficiente</div>'+

  var PANEL_COLS = [
    {key:'ref', label:'Referencia'},
    {key:'nombre', label:'Producto'},
    {key:'canal', label:'Canal'},
    {key:'stockActual', label:'Stock', num:true},
    {key:'avgDaily', label:'Consumo/día', num:true},
    {key:'diasCobertura', label:'Días cobertura', num:true},
    {key:'fechaAgotado', label:'Agotado el'},
    {key:'fechaLimitePedido', label:'Pedir antes de'},
    {key:'cantidadSugerida', label:'Pedir', num:true},
    {key:'alerta', label:'Alerta'}
  ];

  function renderPanelTable(){
    var all = computeAll();

    if(searchTerm){
      var s = searchTerm.toLowerCase();
      all = all.filter(function(r){ return r.ref.toLowerCase().indexOf(s)>=0 || r.nombre.toLowerCase().indexOf(s)>=0; });
    }
    if(alertFilter === 'VENCIDO'){
      all = all.filter(function(r){ return r.vencido; });
    } else if(alertFilter){
      all = all.filter(function(r){ return r.alerta === alertFilter; });
    }

    all.sort(function(a,b){
      var av = a[sortState.col], bv = b[sortState.col];
      if(av instanceof Date || bv instanceof Date){
        av = av? av.getTime(): Infinity; bv = bv? bv.getTime(): Infinity;
      }
      if(typeof av === 'string'){
        var c = av.localeCompare(bv);
        return sortState.dir==='asc'? c : -c;
      }
      var c2 = (av||0) - (bv||0);
      return sortState.dir==='asc'? c2 : -c2;
    });

    document.getElementById('pf-count').textContent = all.length + ' de ' + PRODUCTS_RAW.length + ' productos';

    var head = '<thead><tr>' + PANEL_COLS.map(function(c){
      var arrow = sortState.col===c.key ? (sortState.dir==='asc'?' ▲':' ▼') : '';
      return '<th data-col="'+c.key+'">'+c.label+arrow+'</th>';
    }).join('') + '</tr></thead>';

    var body = all.map(function(r){

    try{

      box.innerHTML =
        '<div class="row cols-3">'+
          '<div class="field"><label>Correo para alertas y pedidos</label><input id="cfg-correo" type="email" value="'+escapeHtml(cfg.correoAlertas||'')+'" placeholder="tu@ilumax.com"></div>'+
          '<div class="field"><label>Nivel de servicio objetivo</label><select id="cfg-nivel">'+
            ['90%','95%','98%','99%'].map(function(v){ return '<option value="'+v+'"'+(v===cfg.nivelServicio?' selected':'')+'>'+v+'</option>'; }).join('') +
          '</select></div>'+
          '<div class="field"><label>Lead time por defecto (días)</label><input id="cfg-leadtime" type="number" value="'+(cfg.leadTimeDefecto||120)+'"></div>'+
        '</div>'+
        '<div class="row cols-3">'+
          '<div class="field"><label>Colchón mínimo (días)</label><input id="cfg-min" type="number" value="'+(cfg.colchonMinimo||15)+'"></div>'+
          '<div class="field"><label>Colchón máximo (días)</label><input id="cfg-max" type="number" value="'+(cfg.colchonMaximo||90)+'"></div>'+
          '<div class="field"><label>Colchón por defecto sin datos (días)</label><input id="cfg-fallback" type="number" value="'+(cfg.colchonFallback||30)+'"></div>'+
        '</div>'+
        '<button class="btn btn-primary" id="cfg-save">Guardar configuración</button>';

      document.getElementById('cfg-save').addEventListener('click', async function(){
        var btn = document.getElementById('cfg-save');
        btn.disabled = true; btn.textContent = 'Guardando…';
        try{
          var body = {
            action: 'updateConfig',
            correoAlertas: document.getElementById('cfg-correo').value.trim(),
            nivelServicio: document.getElementById('cfg-nivel').value,
            leadTimeDefecto: parseFloat(document.getElementById('cfg-leadtime').value)||120,
            colchonMinimo: parseFloat(document.getElementById('cfg-min').value)||15,
            colchonMaximo: parseFloat(document.getElementById('cfg-max').value)||90,
            colchonFallback: parseFloat(document.getElementById('cfg-fallback').value)||30
          };
          var res2 = await fetch(sheetsUrl, { method:'POST', body: JSON.stringify(body) });
          var json2 = await res2.json();
          if (!json2.ok) throw new Error(json2.error||'error');
          toast('Configuración guardada.');

        }catch(e){
          toast('No se pudo guardar la configuración.');
        }
        btn.disabled = false; btn.textContent = 'Guardar configuración';
      });
    }catch(e){
      box.innerHTML = '<div class="empty">No se pudo cargar la configuración desde Sheets.</div>';
    }
  }

  function renderConfigTable(filter){
    var list = PRODUCTS_RAW.slice();
    if(filter){
      var s = filter.toLowerCase();
      list = list.filter(function(p){ return p.ref.toLowerCase().indexOf(s)>=0 || p.nombre.toLowerCase().indexOf(s)>=0; });
    }

    var rows = list.map(function(p){
      var cfg = getConfig(p.ref);
      var transitoVal = cfg.transito !== null ? cfg.transito : p.transito;
      return '<tr data-ref="'+escapeHtml(p.ref)+'">'+
        '<td>'+escapeHtml(p.ref)+'</td>'+
        '<td>'+escapeHtml(p.nombre)+'</td>'+
        '<td><input type="number" class="cf-leadtime" value="'+cfg.leadTime+'" min="0" style="width:80px"></td>'+
        '<td><input type="number" class="cf-safety" value="'+cfg.safety+'" min="0" style="width:80px"></td>'+
        '<td><input type="number" class="cf-transito" value="'+transitoVal+'" min="0" style="width:90px"></td>'+
        '</tr>';
    }).join('');

    if(!list.length){
      rows = '<tr><td colspan="5"><div class="empty">Ningún producto coincide con la búsqueda.</div></td></tr>';
    }

    document.getElementById('cf-table').innerHTML =
      '<table><thead><tr><th>Referencia</th><th>Producto</th><th>Lead time (días)</th><th>Colchón seguridad (días)</th><th>En tránsito</th></tr></thead>'+
      '<tbody>'+rows+'</tbody></table>';

    document.querySelectorAll('#cf-table tr[data-ref]').forEach(function(tr){
      var ref = tr.getAttribute('data-ref');
      function commit(){
        var lt = parseFloat(tr.querySelector('.cf-leadtime').value);
        var sf = parseFloat(tr.querySelector('.cf-safety').value);
        var tr_ = parseFloat(tr.querySelector('.cf-transito').value);
        state.config[ref] = {
          leadTime: isNaN(lt)? DEFAULT_LEAD_TIME : lt,
          safety: isNaN(sf)? DEFAULT_SAFETY : sf,
          transito: isNaN(tr_)? 0 : tr_
        };
        saveState();
        renderStats();
      }
      tr.querySelectorAll('input').forEach(function(inp){
        inp.addEventListener('change', function(){ commit(); toast('Configuración actualizada.'); });
      });
    });
  }

      {label:'90-150 d', min:90, max:150}, {label:'150+ d', min:150, max:Infinity}
    ];
    var histData = buckets.map(function(b){
      return withData.filter(function(r){ return r.diasCobertura>=b.min && r.diasCobertura<b.max; }).length;
    });
    var ctxH = document.getElementById('chart-hist').getContext('2d');
    dashCharts.hist = new Chart(ctxH, {
      type:'bar',
      data:{ labels: buckets.map(function(b){return b.label;}),
        datasets:[{ data: histData,
          backgroundColor: buckets.map(function(b){ return b.max<=30 ? CHART_COLORS.red : (b.max<=90 ? CHART_COLORS.amber : CHART_COLORS.green); }),
          borderRadius: 6 }] },
      options: {
        responsive:true, maintainAspectRatio:false,
        scales: { x:{ grid:{display:false}, ticks:{font:{size:10.5}} }, y:{ grid:{color:CHART_COLORS.grid}, ticks:{precision:0, font:{size:10.5}} } },
        plugins:{ legend:{display:false}, tooltip:{ callbacks:{ label:function(c){ return ' '+c.parsed.y+' SKU'; } } } }
      }
    });

    // ---------- Tendencia de consumo (histórico 3 meses embebidos) ----------
    var rawFiltered = dashCanalFilter ? PRODUCTS_RAW.filter(function(p){return p.canal===dashCanalFilter;}) : PRODUCTS_RAW;
    var mesesSum = [0,0,0];
    rawFiltered.forEach(function(p){
      for(var i=0;i<3;i++){ if(typeof p.m[i]==='number' && p.m[i]>0) mesesSum[i]+=p.m[i]; }
    });
    var ctxTr = document.getElementById('chart-trend').getContext('2d');
    var trendGrad = ctxTr.createLinearGradient(0,0,0,220);
    trendGrad.addColorStop(0, 'rgba(20,33,61,.28)');
    trendGrad.addColorStop(1, 'rgba(20,33,61,0)');
    dashCharts.trend = new Chart(ctxTr, {
      type:'line',
      data:{ labels:['Mes -2','Mes -1','Mes actual'],
        datasets:[{ data: mesesSum, borderColor: CHART_COLORS.navy, backgroundColor: trendGrad,
          fill:true, tension:.35, pointRadius:5, pointBackgroundColor:'#fff', pointBorderColor:CHART_COLORS.navy, pointBorderWidth:2, borderWidth:2.5 }] },
      options: {
        responsive:true, maintainAspectRatio:false,
        scales: { x:{ grid:{display:false}, ticks:{font:{size:11}} }, y:{ grid:{color:CHART_COLORS.grid}, ticks:{font:{size:10.5}, callback:function(v){return v.toLocaleString('es-CO');}} } },
        plugins:{ legend:{display:false}, tooltip:{ callbacks:{ label:function(c){ return ' '+c.parsed.y.toLocaleString('es-CO')+' unidades'; } } } }
      }
    });
  }

  function kpiCard2(icon, num, label, cls, filterValue){
    var extraClass = filterValue ? ' click-kpi' : '';
    var extraAttr = filterValue ? ' data-filter="'+filterValue+'"' : '';
    var colorVar = cls==='red'?'var(--red)':cls==='green'?'var(--green)':cls==='amber'?'var(--amber)':'var(--muted)';
    var bgVar = cls==='red'?'var(--red-soft)':cls==='green'?'var(--green-soft)':cls==='amber'?'var(--amber-soft)':'var(--gray-soft)';
    return '<div class="stat2'+extraClass+'"'+extraAttr+'>'+
      '<div class="kpi-icon" style="background:'+bgVar+';color:'+colorVar+';">'+icon+'</div>'+
      '<div class="num">'+num+'</div>'+
      '<div class="lbl">'+label+'</div></div>';
  }

  function kpiCard(num, label, cls, filterValue){
    var extraClass = filterValue ? ' click-kpi' : '';
    var extraAttr = filterValue ? ' data-filter="'+filterValue+'"' : '';
    var cursorStyle = filterValue ? 'cursor:pointer;' : '';
    return '<div class="stat '+cls+extraClass+'"'+extraAttr+' style="'+cursorStyle+'background:var(--gray-soft);border-color:var(--line);">'+
      '<div class="num" style="color:var(--ink);">'+num+'</div>'+
      '<div class="lbl" style="color:var(--muted);">'+label+'</div></div>';
  }

  // ---------- View: Proyección ----------
  function renderProyeccionView(){
    var el = document.getElementById('view-proyeccion');
    el.innerHTML =
      '<div class="panel">'+
        '<h2>Proyección de inventario — próximos 6 meses</h2>'+
        '<p class="desc">Proyecta el stock disponible mes a mes si no llega ningún pedido nuevo además de lo que ya está en tránsito. Útil para decidir con cuánta anticipación pedir, dado el lead time de 4 meses.</p>'+
        '<div id="proy-riesgo"></div>'+
        '<div class="toolbar" style="margin-top:16px;">'+
          '<input type="text" id="proy-search" placeholder="Buscar por referencia o nombre…">'+
        '</div>'+
        '<div class="table-scroll" id="proy-table"></div>'+
      '</div>';

    document.getElementById('proy-search').value = proySearch;
    document.getElementById('proy-search').addEventListener('input', function(e){ proySearch = e.target.value; renderProyeccionTable(); });

    renderProyeccionRiesgo();
    renderProyeccionTable();
  }

  function projectMonths(r){
    var base = r.stockActual + r.transito;
    var months = [];
    for(var i=1;i<=6;i++){
      if(r.avgDaily>0){
        months.push(Math.max(0, Math.round(base - r.avgDaily*30*i)));
      } else {
        months.push(null);
      }
    }
    return months;
  }

  function renderProyeccionRiesgo(){
    var all = computeAll();
    var counts = [0,0,0,0,0,0];
    all.forEach(function(r){
      var months = projectMonths(r);
      months.forEach(function(v, idx){ if(v === 0) counts[idx]++; });
    });
    var max = Math.max.apply(null, counts.concat([1]));
    var bars = counts.map(function(c, idx){
      var pct = (c/max)*100;
      return '<div style="flex:1;text-align:center;">'+
        '<div style="height:70px;display:flex;align-items:flex-end;">'+
          '<div style="width:100%;background:linear-gradient(180deg, var(--amber), var(--red));border-radius:4px 4px 0 0;height:'+Math.max(pct,4)+'%;"></div>'+
        '</div>'+
        '<div class="hint" style="margin-top:6px;font-weight:700;color:var(--ink);">'+c+'</div>'+
        '<div class="hint">Mes +'+(idx+1)+'</div>'+
      '</div>';
    }).join('');
    document.getElementById('proy-riesgo').innerHTML =
      '<p class="desc" style="margin-bottom:8px;">SKU proyectados en cero unidades por mes (sin pedidos adicionales):</p>'+
      '<div style="display:flex;gap:10px;align-items:flex-end;padding:10px 4px;">'+bars+'</div>';
  }

  function renderProyeccionTable(){
    var all = computeAll();
    if(proySearch){
      var s = proySearch.toLowerCase();
      all = all.filter(function(r){ return r.ref.toLowerCase().indexOf(s)>=0 || r.nombre.toLowerCase().indexOf(s)>=0; });
    }
    all.sort(function(a,b){ return a.diasCobertura - b.diasCobertura; });

    var head = '<thead><tr><th>Referencia</th><th>Producto</th><th>Stock hoy</th>'+
      [1,2,3,4,5,6].map(function(i){return '<th>Mes +'+i+'</th>';}).join('')+
      '<th>Agotado el</th></tr></thead>';

    var body = all.map(function(r){
      var months = projectMonths(r);
      var cells = months.map(function(v){
        if(v===null) return '<td class="num-cell">—</td>';
        var style = v===0 ? 'color:var(--red);font-weight:700;' : '';
        return '<td class="num-cell" style="'+style+'">'+v+'</td>';
      }).join('');
      return '<tr><td>'+escapeHtml(r.ref)+'</td><td>'+escapeHtml(r.nombre)+'</td>'+
        '<td class="num-cell">'+Math.round(r.stockActual)+'</td>'+cells+
        '<td class="num-cell">'+fmtDate(r.fechaAgotado)+'</td></tr>';
    }).join('');

    if(!all.length){
      body = '<tr><td colspan="10"><div class="empty">Ningún producto coincide con la búsqueda.</div></td></tr>';
    }

    document.getElementById('proy-table').innerHTML = '<table>'+head+'<tbody>'+body+'</tbody></table>';
  }

  // ---------- View: Proveedores ----------
  function renderProveedoresView(){
    var el = document.getElementById('view-proveedores');

    if (!connected){
      el.innerHTML = '<div class="panel"><h2>Proveedores</h2>'+
        '<p class="desc">Conéctate a Google Sheets (barra de arriba) para ver y administrar tus proveedores y sus tiempos de entrega desde aquí.</p></div>';
      return;
    }

    el.innerHTML =
      '<div class="panel">'+
        '<h2>Agregar / editar proveedor</h2>'+
        '<p class="desc">Si el nombre ya existe, se actualiza; si no, se crea uno nuevo.</p>'+
        '<div class="row cols-4">'+
          '<div class="field"><label>Nombre del proveedor</label><input id="pv-nombre" placeholder="Ej: Proveedor China Directo"></div>'+
          '<div class="field"><label>Lead time (días)</label><input id="pv-leadtime" type="number" value="120"></div>'+
          '<div class="field"><label>Correo de contacto</label><input id="pv-contacto" type="email" placeholder="compras@proveedor.com"></div>'+
          '<div class="field"><label>Notas</label><input id="pv-notas" placeholder="Opcional"></div>'+
        '</div>'+
        '<button class="btn btn-primary" id="pv-save">Guardar proveedor</button>'+
      '</div>'+
      '<div class="panel">'+
        '<h2>Proveedores registrados</h2>'+
        '<div class="table-scroll" id="pv-table"><div class="empty">Cargando…</div></div>'+
      '</div>';

    document.getElementById('pv-save').addEventListener('click', async function(){
      var nombre = document.getElementById('pv-nombre').value.trim();
      var leadTime = parseFloat(document.getElementById('pv-leadtime').value);
      var contacto = document.getElementById('pv-contacto').value.trim();
      var notas = document.getElementById('pv-notas').value.trim();
      if (!nombre){ toast('Escribe el nombre del proveedor.'); return; }
      var btn = document.getElementById('pv-save');
      btn.disabled = true; btn.textContent = 'Guardando…';
      try{
        var res = await fetch(sheetsUrl, {
          method:'POST',
          body: JSON.stringify({ action:'addProveedor', nombre: nombre, leadTime: leadTime||120, contacto: contacto, notas: notas })
        });
        var json = await res.json();
        if (!json.ok) throw new Error(json.error||'error');
        toast('Proveedor guardado: ' + nombre);
        document.getElementById('pv-nombre').value = '';
        document.getElementById('pv-contacto').value = '';
        document.getElementById('pv-notas').value = '';
        renderTablaProveedores(json.proveedores);
        sincronizarSheets();
      }catch(e){
        toast('No se pudo guardar el proveedor.');
      }
      btn.disabled = false; btn.textContent = 'Guardar proveedor';
    });

    cargarProveedores();
  }

  async function cargarProveedores(){
    try{
      var res = await fetch(sheetsUrl + '?action=proveedores');
      var json = await res.json();
      if (!json.ok) throw new Error(json.error||'error');
      renderTablaProveedores(json.proveedores);
    }catch(e){
      document.getElementById('pv-table').innerHTML = '<div class="empty">No se pudo cargar la lista de proveedores.</div>';
    }
  }

  function renderTablaProveedores(proveedores){
    var box = document.getElementById('pv-table');
    if (!box) return;
    if (!proveedores || !proveedores.length){
      box.innerHTML = '<div class="empty">Todavía no tienes proveedores registrados.</div>';
      return;
    }
    var rows = proveedores.map(function(p){
      return '<tr><td>'+escapeHtml(p.nombre)+'</td><td class="num-cell">'+p.leadTime+'</td>'+
        '<td>'+escapeHtml(p.contacto||'—')+'</td><td>'+escapeHtml(p.notas||'')+'</td>'+
        '<td style="white-space:nowrap;">'+
          '<button class="btn-ghost" style="padding:5px 10px;font-size:12px;margin-right:6px;" data-edit-prov="'+escapeHtml(p.nombre)+'">Editar</button>'+
          '<button class="btn-danger-outline" data-del-prov="'+escapeHtml(p.nombre)+'">Eliminar</button>'+
        '</td></tr>';
    }).join('');
    box.innerHTML = '<table><thead><tr><th>Proveedor</th><th>Lead time (días)</th><th>Contacto</th><th>Notas</th><th></th></tr></thead><tbody>'+rows+'</tbody></table>';

    document.querySelectorAll('[data-edit-prov]').forEach(function(btn){
      btn.addEventListener('click', function(){
        var prov = proveedores.find(function(x){return x.nombre===btn.getAttribute('data-edit-prov');});
        if (!prov) return;
        document.getElementById('pv-nombre').value = prov.nombre;
        document.getElementById('pv-leadtime').value = prov.leadTime;
        document.getElementById('pv-contacto').value = prov.contacto||'';
        document.getElementById('pv-notas').value = prov.notas||'';
        document.getElementById('pv-nombre').scrollIntoView({behavior:'smooth', block:'center'});
        toast('Editando "'+prov.nombre+'" — cambia los datos y guarda.');
      });
    });
    document.querySelectorAll('[data-del-prov]').forEach(function(btn){
      btn.addEventListener('click', async function(){
        var nombre = btn.getAttribute('data-del-prov');
        if (!confirm('¿Eliminar el proveedor "'+nombre+'"? Los productos que lo tengan asignado pasarán a usar el lead time por defecto.')) return;
        try{
          var res = await fetch(sheetsUrl, { method:'POST', body: JSON.stringify({ action:'deleteProveedor', nombre: nombre }) });
          var json = await res.json();
          if (!json.ok) throw new Error(json.error||'error');
          toast('Proveedor eliminado.');
          renderTablaProveedores(json.proveedores);
          sincronizarSheets();
        }catch(e){ toast('No se pudo eliminar el proveedor.'); }
      });
    });
  }

  // ---------- Init ----------
  async function init(){
    // Populate datalist once
    var dl = document.getElementById('productList');
    dl.innerHTML = PRODUCTS_RAW.map(function(p){
      return '<option value="'+escapeHtml(p.ref+' — '+p.nombre)+'"></option>';
    }).join('');
    // adjust matchProduct to also accept "ref — nombre" format
    var origMatch = matchProduct;
    matchProduct = function(input){
      if(!input) return null;
      var dashIdx = input.indexOf(' — ');
      if(dashIdx>0){
        var refPart = input.slice(0,dashIdx).trim();
        var found = PRODUCTS_RAW.find(function(p){ return p.ref === refPart; });
        if(found) return found;
      }
      return origMatch(input);
    };

    await loadState();

    document.getElementById('settings-btn').addEventListener('click', abrirAjustesConexion);

    // Reconectar automáticamente: usa la URL guardada, o si no hay ninguna, la URL por defecto embebida
    try{
      var saved = await window.storage.get(STORE_URL_KEY, false);
      var urlAUsar = (saved && saved.value) ? saved.value : DEFAULT_SHEETS_URL;
      await conectarSheets(urlAUsar, true);
    }catch(e){
      await conectarSheets(DEFAULT_SHEETS_URL, true);
    }

    renderStats();
    renderDashboardView();
  }

  init();
})();

</script>
</body>
</html>
