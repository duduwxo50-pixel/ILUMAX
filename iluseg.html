<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ILUMAX Pro — Seguro</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
:root{
  --bg:#07070d;--s1:#0f0f1a;--s2:#161623;--s3:#1e1e2e;
  --b1:#2a2a40;--b2:#363650;
  --acc:#f5c518;--accd:rgba(245,197,24,.1);
  --tx:#eeeef8;--mu:#7070a0;
  --gr:#22c55e;--grd:rgba(34,197,94,.1);
  --rd:#ef4444;--rdd:rgba(239,68,68,.1);
  --bl:#3b82f6;--bld:rgba(59,130,246,.1);
  --or:#f97316;--ord:rgba(249,115,22,.1);
  --r:10px;--r2:14px;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--tx);font-size:14px;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px;}
.login-box{background:var(--s1);border:1px solid var(--b1);border-radius:var(--r2);padding:36px;width:100%;max-width:400px;}
.logo{margin-bottom:4px;}
.logo-sub{font-size:11px;color:var(--mu);margin-bottom:28px;}
.fl{font-size:11px;color:var(--mu);margin-bottom:5px;display:block;}
.inp{background:var(--s2);border:1px solid var(--b1);border-radius:8px;color:var(--tx);font-family:inherit;font-size:13px;padding:10px 12px;width:100%;transition:border-color .15s;margin-bottom:12px;}
.inp:focus{outline:none;border-color:var(--acc);}
.btn{padding:11px;border-radius:8px;border:none;cursor:pointer;font-size:13px;font-weight:700;font-family:inherit;width:100%;transition:all .15s;}
.bp{background:var(--acc);color:#000;}.bp:hover{background:#e6b800;}
.err-box{background:var(--rdd);border:1px solid rgba(239,68,68,.3);border-radius:8px;padding:10px 13px;font-size:12px;color:var(--rd);margin-bottom:12px;display:none;}
.sec-note{font-size:10px;color:var(--mu);text-align:center;margin-top:16px;display:flex;align-items:center;justify-content:center;gap:5px;}
.attempts{font-size:11px;color:var(--or);text-align:center;margin-top:8px;display:none;}
</style>
</head>

async function sha256(msg) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(msg));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}

async function doLogin() {
  if (bloqueado) { showErr('Demasiados intentos. Espera 5 minutos.'); return; }
  const user = document.getElementById('l-user').value.trim().toLowerCase();
  const pass = document.getElementById('l-pass').value;
  const btn = document.getElementById('l-btn');
  if (!user || !pass) { showErr('Completa usuario y contraseña'); return; }
  btn.textContent = '⏳ Verificando...'; btn.disabled = true;
  const hash = await sha256(pass);
  await new Promise(r => setTimeout(r, 600)); // delay anti-brute-force
  const u = USERS[user];
  if (u && u.hash === hash) {
    // Sesión exitosa
    const token = btoa(JSON.stringify({ user, rol: u.rol, nombre: u.nombre, exp: Date.now() + 8*60*60*1000 }));
    sessionStorage.setItem('ilx_session', token);
    sessionStorage.setItem('ilx_user', JSON.stringify({ user, rol: u.rol, nombre: u.nombre }));
    window.location.href = 'ilumax-pro.html';
  } else {
    intentos++;
    btn.textContent = '🔐 Ingresar'; btn.disabled = false;
    if (intentos >= MAX_INT) {
      bloqueado = true;
      showErr('Cuenta bloqueada por 5 minutos por múltiples intentos fallidos');
      setTimeout(() => { bloqueado = false; intentos = 0; document.getElementById('err-box').style.display='none'; }, 300000);
    } else {
      showErr(`Credenciales incorrectas. Intento ${intentos}/${MAX_INT}`);
      const at = document.getElementById('attempts');
      at.style.display='block';
      at.textContent = `${MAX_INT - intentos} intento(s) restante(s) antes del bloqueo`;
    }
  }
}

function showErr(msg) {
  const b = document.getElementById('err-box');
  document.getElementById('err-msg').textContent = msg;
  b.style.display = 'block';
}

// Revisar si ya hay sesión activa
const sess = sessionStorage.getItem('ilx_session');
if (sess) {
  try {
    const data = JSON.parse(atob(sess));
    if (data.exp > Date.now()) window.location.href = 'ilumax-pro.html';
  } catch(e) { sessionStorage.clear(); }
}
</script>
